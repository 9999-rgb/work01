# geo 的静态值保留字面量美元符号，避免把 JavaScript 模板当作 Nginx 变量。
geo $xczs_dollar { default "$"; }
map $http_upgrade $xczs_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xczs_connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    location = /api { return 308 /api/; }
    location /api/ { proxy_pass http://127.0.0.1:8090/; }
    location / {
        proxy_pass http://127.0.0.1:8090;
        sub_filter_once off;
        sub_filter '`${xczs_dollar}{autoProto}//${xczs_dollar}{autoHost}:${xczs_dollar}{unifiedPort}`' 'window.location.origin + "/api"';
    }
}
