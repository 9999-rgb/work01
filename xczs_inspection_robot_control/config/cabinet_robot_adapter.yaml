/**/xczs_cabinet_button_operator:
  ros__parameters:
    # 机器人适配层：更换机器人时只替换这些 MoveIt/Nav2/工具参数。
    robot_model_name: xczs_inspection_robot
    move_group: manipulator
    move_group_namespace: /
    planning_tip_link: end
    contact_tool_link: button_press_tip
    transport_named_target: home
    planning_time: 10.0
    planning_attempts: 10
    planning_velocity_scale: 0.20
    planning_acceleration_scale: 0.20
    goal_position_tolerance: 0.005
    goal_orientation_tolerance: 0.01
    goal_joint_tolerance: 0.001
    allow_replanning: true
    navigation_base_frame: base_link
    docking_base_frame: body
    grasp_brake_link: body
    base_link_yaw_offset: 1.57079632679
    navigation_takeover_distance: 0.15
    navigation_takeover_yaw_tolerance: 0.35
    navigation_takeover_stall_timeout: 4.0
    docking_timeout: 45.0
    docking_position_tolerance: 0.008
    docking_yaw_tolerance: 0.070
    docking_max_linear_speed: 0.15
    docking_max_angular_speed: 0.45
    docking_linear_gain: 0.8
    docking_angular_gain: 1.2
    # 多柜体共用同一机械臂和底盘；任何实际运动前必须取得全局短租约。
    operation_lease_service: /xczs/operation_lease
    operation_lease_duration: 3.0
    operation_lease_renew_period: 0.75
    operation_lease_request_timeout: 0.50
    # 末端轨迹与 Gazebo 接触约束之间会有亚毫米误差；按物理关节反馈
    # 小步补偿，保证请求力对应实际弹簧位移，而不是只相信规划位姿。
    force_tracking_tolerance: 0.00005
    force_tracking_max_compensation: 0.0010
    force_tracking_settle_seconds: 0.15
    force_tracking_attempts: 3
    # 仅按压向内段可接受接近完整的候选路径，之后必须由真实关节位移
    # 闭环补偿；接近和安全撤回仍使用代码默认的 99% 门槛。
    button_press_minimum_cartesian_fraction: 0.95
    # 后门把手位于柜体背面。当前任务目录只提供正面标准工位；从该工位
    # 机械臂既无法越过柜体到达把手，现有三柜布局也没有无碰撞后侧工位。
    # 这是机器人/场地能力限制，不写入共用的设备几何参数；增加经过 Nav2
    # 验证的后侧工位后，可在新的适配参数包中重新启用。
    controls:
      cabinet_rear_door:
        operable: false
        unavailable_reason: >-
          当前仅配置柜体正面操作工位，后门把手位于柜体背面且被柜体实体隔挡；
          现有三柜布局没有经过 Nav2 验证的安全后侧工位。
      # 以下按钮在几何候选筛查后，又逐项执行了 cabinet_a 标准工位的
      # 完整 MoveIt 接近、按压和撤回流程；无碰撞路径运行验证均未通过。
      # 它们不是下方“纯运动学工作空间外”清单的一部分，后续重新标定
      # 并通过完整闭环验收后，可按控件在新的机器人适配包中重新启用。
      box_5_button_1:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      box_5_button_2:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      box_6_button_1:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      box_6_button_2:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      box_7_button_1:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      box_7_button_2:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      box_8_button_1:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      box_8_button_2:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      box_10_button_2:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      box_11_button_1:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      box_11_button_2:
        operable: false
        unavailable_reason: >-
          当前 cabinet_a 标准工位的完整 MoveIt 无碰撞接近、按压和撤回路径
          未通过运行验证；重新标定并完成闭环验收前禁用。
      # 7～11 号旋钮在几何上可达，但当前 Gazebo 位置控制后端的
      # 刚性跨模型抓取会带动非目标控件。柔顺隔离方案虽消除了
      # 误触，但尚未通过目标档位到达验证，因此在机器人适配层禁用。
      box_7_knob:
        operable: false
        unavailable_reason: >-
          当前 Gazebo 位置控制后端的刚性跨模型抓取会误触非目标控件；
          隔离碰撞的柔顺执行方案尚未通过目标档位验证。
      box_8_knob:
        operable: false
        unavailable_reason: >-
          当前 Gazebo 位置控制后端的刚性跨模型抓取会误触非目标控件；
          隔离碰撞的柔顺执行方案尚未通过目标档位验证。
      box_9_knob:
        operable: false
        unavailable_reason: >-
          当前 Gazebo 位置控制后端的刚性跨模型抓取会误触非目标控件；
          隔离碰撞的柔顺执行方案尚未通过目标档位验证。
      box_10_knob:
        operable: false
        unavailable_reason: >-
          当前 Gazebo 位置控制后端的刚性跨模型抓取会误触非目标控件；
          隔离碰撞的柔顺执行方案尚未通过目标档位验证。
      box_11_knob:
        operable: false
        unavailable_reason: >-
          当前 Gazebo 位置控制后端的刚性跨模型抓取会误触非目标控件；
          隔离碰撞的柔顺执行方案尚未通过目标档位验证。
    # 移除升降轴后的当前六轴机械臂能力边界。更换机器人时仅需覆盖本清单。
    unreachable_control_ids:
      - box_1_button_1
      - box_1_button_2
      - box_2_button_1
      - box_2_button_2
      - box_3_button_1
      - box_3_button_2
      - box_4_button_1
      - box_4_button_2
      - box_1_knob
      - box_2_knob
      - box_3_knob
      - box_4_knob
      - box_5_knob
      - box_6_knob
      - cabinet_main_switch
    unreachable_control_reason: >-
      移除升降轴后，该控件超出当前六轴机械臂在标准工位的运动学工作空间。

/xczs_operation_lease_coordinator:
  ros__parameters:
    service_name: /xczs/operation_lease
    # operator 每 0.75 秒续租；崩溃后最多 3 秒自动释放，最大请求限制为 5 秒。
    maximum_lease_duration: 5.0
