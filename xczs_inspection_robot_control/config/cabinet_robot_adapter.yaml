    # 物理执行能力采用正向清单，避免新增或漏列控件被默认开放。
    # 每个完成可达、碰撞、接触、状态、无串扰和恢复闭环验收的
    # 控件才可加入该清单，未列控件一律只做实时规划验证。
    operable_control_ids: [box_5_knob]
    inoperable_control_reason: >-
      5 号柜旋钮已通过可达性、碰撞、中/左/右档物理往返、无串扰与回位闭环验收。
      其余控件实测仍存在末端工具与面板干涉、无运动学解或无碰撞路径，或尚未
      完成物理到档验收。为避免超出机器人现有硬件能力，未列控件仅保留状态显示和
      实时规划验证，不下发机械臂、抓取或柜体写入命令。

/xczs_operation_lease_coordinator:
  ros__parameters:
    service_name: /xczs/operation_lease
    # operator 每 0.75 秒续租；崩溃后最多 3 秒自动释放，最大请求限制为 5 秒。
    maximum_lease_duration: 5.0
