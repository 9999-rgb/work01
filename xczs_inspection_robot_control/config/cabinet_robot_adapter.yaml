      - box_10_button_2
      - box_5_knob
      - cabinet_main_switch
    inoperable_control_reason: >-
      未列入 operable_control_ids 的控件仅保留状态显示和实时规划验证；流程会明确
      标记“未完成物理验收”，不会执行抓取或柜体写入。1/2 号柜按钮（顶部，press 工具点
      高约 1.27 m）与 11 号柜按钮（底部，press 工具点贴近地面）超出右臂在
      现工位退距下的可达工作空间，OMPL 无法为 prepress 目标采样有效解。
      其余 knob（box_3/4/6/7/8/9/10/11 等）尚未完成带安全退距的旋转到档
      验收；cabinet_rear_door 尚未完成开合到位、释放、回收和无串扰闭环，
