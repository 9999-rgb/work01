/**:
  ros__parameters:
    # 跨节点共享的机器人接口契约（与共享 cabinet_robot_adapter.yaml 相同；
    # 本文件为电气夹层夹具实例自包含的机器人适配层）。
    # pose_parent_frame 必须为 map：夹具几何按恒等位姿声明于世界/map 系（夹具
    # 模型随场景加载于 map 原点，controls/instances 坐标均为 map 坐标），而本
    # 场景中机器人底盘行走层在 map 原点下方（map->odom z≈-0.546，odom 原点在
    # 启动位姿处）。若把夹具 frame 以恒等位姿挂到 odom（旧版），odom→cabinet
    # = 恒等，operator 按 odom 规划的所有 map 系目标点会被整体压低 0.55 m
    # （cap-2 verify5 双臂杆端在 p≈0 顶死柜体下部面板的根因）。挂 map 后
    # odom→cabinet = odom→map（AMCL 实时），由 operator 在任务起始 latch。
    planning_frame: odom
    pose_parent_frame: map
    # operator 柜体位姿 watchdog 校验系 = map（与 pose_parent_frame 合同一致）：
    # map→cabinet 为 pose authority 静态/测量真值，AMCL 的 map→odom 修正不改变
    # 它；若按 odom 校验会把定位修正误判为柜体位移（docking 期底盘机动时单步
    # 修正可达 20mm+ → 误中止 cap-2 docking）。共享柜体（odom 锚定）不设此项，
    # 回退 planning_frame 保持旧语义。
    cabinet_verify_frame: map
    manual_linear_axis: y
    manual_linear_sign: -1.0
    navigation_velocity_yaw_offset: -1.57079632679
    allow_embedded_navigation: false
    navigation_frame: map
    navigation_base_frame: base_link
    navigation_action: /navigate_to_pose
    navigation_readiness_service: /lifecycle_manager_navigation/is_active
    navigation_mode_service: /xczs/set_navigation_mode
    navigation_mode_topic: /xczs/navigation_mode
    map_topic: /map
    navigation_keepout: null
    localization_pose_topic: /amcl_pose
    manual_cmd_vel_topic: /xczs/manual_cmd_vel
    navigation_cmd_vel_topic: /cmd_vel
    base_output_topic: /xczs/cmd_vel
    joint_trajectory_topic: /xczs/joint_trajectory
    joint_state_topic: /xczs/joint_states
    # 夹具场景重置基座位姿 = 场景 robot_spawn（(4,4) 机头朝 +X，位于柜体正面
    # 东侧）。
    reset_base_pose:
      frame_id: map
      x: 4.0
      y: 4.0
      yaw: 0.0
    reset_joint_tolerance: 0.12
    reset_joint_timeout_sec: 15.0
    reset_joint_duration_sec: 5.0
    controller_namespace: /xczs
    manual_joint_group_names:
      - left_arm
      - right_arm
      - three_cylinder
      - two_cylinder
      - rocker
      - rotate_button
    manual_joint_groups:
      left_arm:
        - l_arm_0_joint
        - l_arm_1_joint
        - l_arm_2_joint
        - l_arm_3_joint
        - l_arm_4_joint
        - l_arm_5_joint
        - l_arm_6_joint
      right_arm:
        - r_arm_0_joint
        - r_arm_1_joint
        - r_arm_2_joint
        - r_arm_3_joint
        - r_arm_4_joint
        - r_arm_5_joint
        - r_arm_6_joint
      three_cylinder:
        - r_three_cyl_finger1_joint
        - r_three_cyl_finger2_joint
        - r_three_cyl_finger3_joint
      two_cylinder:
        - l_two_cyl_finger1_joint
        - l_two_cyl_finger2_joint
      rocker:
        - l_rocker_rotor_joint
      rotate_button:
        - r_rotbtn_rotate_joint
        - r_rotbtn_jaw1_joint
        - r_rotbtn_jaw2_joint
    manual_joint_groups_by_toolset:
      A:
        - left_arm
        - right_arm
        - three_cylinder
        - two_cylinder
      B:
        - left_arm
        - right_arm
        - rocker
        - rotate_button
    manual_joint_limits:
      l_arm_0_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      l_arm_1_joint: {min_position: -2.8, max_position: 2.8, default_position: -1.4}
      l_arm_2_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      l_arm_3_joint: {min_position: -2.8, max_position: 2.8, default_position: -0.3}
      l_arm_4_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      l_arm_5_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.7}
      l_arm_6_joint: {min_position: -2.8, max_position: 2.8, default_position: -0.85}
      r_arm_0_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      r_arm_1_joint: {min_position: -2.8, max_position: 2.8, default_position: -1.6}
      r_arm_2_joint: {min_position: -2.8, max_position: 2.8, default_position: -0.4}
      r_arm_3_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      r_arm_4_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      r_arm_5_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.8}
      r_arm_6_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.1}
      r_three_cyl_finger1_joint: {min_position: 0.0, max_position: 0.12, default_position: 0.0}
      r_three_cyl_finger2_joint: {min_position: 0.0, max_position: 0.12, default_position: 0.0}
      r_three_cyl_finger3_joint: {min_position: 0.0, max_position: 0.0254, default_position: 0.0}
      l_two_cyl_finger1_joint: {min_position: 0.0, max_position: 0.12, default_position: 0.0}
      l_two_cyl_finger2_joint: {min_position: 0.0, max_position: 0.12, default_position: 0.0}
      l_rocker_rotor_joint: {min_position: -3.14, max_position: 3.14, default_position: 0.0}
      r_rotbtn_rotate_joint: {min_position: -3.14, max_position: 3.14, default_position: 0.0}
      r_rotbtn_jaw1_joint: {min_position: 0.0, max_position: 0.018, default_position: 0.0}
      r_rotbtn_jaw2_joint: {min_position: 0.0, max_position: 0.018, default_position: 0.0}

/**/xczs_cabinet_button_operator:
  ros__parameters:
    # 机器人适配层：tool_profiles 与全局标定沿用共享柜体目录，仅 controls
    # （夹具导航工位）与 operable_control_ids 按电气夹层夹具定制 —— AGENT
    # P3 起 db1 为唯一 drawer 流程操作对象；dm1/ds2/ds3 维持既有 slider 语义
    # 待 §9 推广；ds1（高抽屉不可达）仅保留停靠工位 + 状态展示。
    robot_model_name: xczs_inspection_robot
    move_group_namespace: /
    planning_time: 10.0
    planning_attempts: 10
    planning_velocity_scale: 0.30
    planning_acceleration_scale: 0.30
    goal_position_tolerance: 0.005
    goal_orientation_tolerance: 0.01
    goal_joint_tolerance: 0.001
    allow_replanning: true
    press_depth: 0.008
    prepress_distance: 0.12
    docking_base_frame: body
    docking_base_footprint: [-0.42, -0.42, -0.42, 0.42, 0.55, 0.42, 0.55, -0.42]
    docking_base_footprint_padding: 0.03
    grasp_brake_link: body
    # 两指/三指工具的标定关节在闭合位会发生接触碰撞，ODE 把二者推到接触
    # 平衡，实测静息位约 2.5-4mm（finger2 最高 0.003976）。容差 0.003 贴在
    # 静息位边界上，任一间隙变化就触发校准失败；放宽到 0.006 覆盖静差。
    # 对抓取的影响可忽略（bimanual 附着容差 0.12m）。
    tool_tip_calibration_joint_tolerance: 0.006
    tool_profiles:
      button:
        move_group: right_arm
        contact_tool_link: r_three_cyl_base
        transport_named_target: home
        tool_tip_position: [0.0265, -0.061735, -0.3885]
        calibration_joint_names:
          - r_three_cyl_finger1_joint
          - r_three_cyl_finger2_joint
          - r_three_cyl_finger3_joint
        calibration_joint_positions: [0.0, 0.0, 0.0]
      knob:
        move_group: right_arm
        contact_tool_link: r_rotbtn_body
        grasp_link: r_rotbtn_rotate
        transport_named_target: home
        tool_axis_orientation: toward_control
        tool_tip_position: [-0.0613, -0.006, 0.1885]
      # 电气夹层暂无 switch/door，但 operator 要求 button 非空时四档
      # tool_profiles 全声明；沿用共享柜体的同工具集 profile。
      switch:
        move_group: left_arm
        contact_tool_link: l_rocker_body
        grasp_link: l_rocker_rotor
        transport_named_target: home
        tool_axis_orientation: toward_control
        tool_tip_position: [-0.01, -0.07, 0.2611]
      door:
        move_group: right_arm
        contact_tool_link: r_three_cyl_base
        grasp_point_position: [0.0265, -0.061735, -0.3885]
        transport_named_target: home
        tool_tip_position: [0.0265, -0.061735, -0.3885]
        calibration_joint_names:
          - r_three_cyl_finger1_joint
          - r_three_cyl_finger2_joint
          - r_three_cyl_finger3_joint
        calibration_joint_positions: [0.0, 0.0, 0.0]
    # 双手抽拉抽屉工具（P3）：左电缸两指探针（two_cylinder）+ 右电缸三指探针
    # （three_cylinder）。tool_tip_position 为该侧工具最深指端（业务点）在
    # contact_tool_link 局部系的位置：
    #   - 右三指：沿用 button/door 实测标定 [0.0265, -0.061735, -0.3885]；
    #   - 左两指：finger2(endlink2) 最深，几何指端 (-0.034, -0.061735, -0.3885)
    #     （P3-8 实测复核；2026-09-02 起 bimanual 附着门收紧到
    #     grasp_contact_threshold 0.02m，探针须真正贴住把手，不再悬空附着）。
    # calibration_joint_* 闭合手指至零位，使工具处于已标定外形。
    drawer_tools:
      # 2026-09-03 AGENT §4.2: per-side rod ROLE contract (P1 末端电机职责).
      # 职责命名与「只有 calibration_joint_positions」彻底分离：
      #   support_joint/contact_link  = 支撑伸缩电缸的移动关节/移动连杆；
      #   gripper_joint/contact_link  = 夹爪电缸的移动关节/移动连杆；
      #   support/gripper_contact_point_local = 杆端在「移动连杆局部系」的接触
      #     偏移（由工具 STL z-extent 实测：finger1/2 族 ~-0.075/-0.09/-0.095、
      #     finger3 短杆 -0.013）；量得的是连杆原点→杆端沿 -Z 的距离。
      #   *_retracted/open_position = 电缸回位（缩回/张开），恒 0。
      #   support_contact_position / gripper_grasp_position = §7.2 阶段 4/5
      #     现场封定的伸出工作值：<=0 表示该电缸阶段尚未封定、流程退回
      #     「仅机械臂位姿」旧行为，直到封定写入此处。右解锁角色按现有约定
      #     留在每抽屉 controls.yaml 的 unlock_* 字段（与插件解锁服务同源），
      #     不在 drawer_tools 重复声明。
      left:
        move_group: left_arm
        contact_tool_link: l_two_cyl_base
        transport_named_target: home
        # 左工具绕作业轴翻转 180°，使 finger1 支撑杆列位于 finger2 夹爪列的
        # 外侧（西侧缝方向）；右工具无需翻转，支撑列自然位于东侧缝方向。两侧
        # 形成“夹爪贴把手立板、支撑杆对同侧侧缝口”的同构镜像（2026-09-03
        # AGENT §4.3 侧缝语义，废止旧“下方抵柜面”布局）。
        tool_roll_offset: 3.14159265359
        tool_tip_position: [-0.034, -0.061735, -0.3885]
        calibration_joint_names:
          - l_two_cyl_finger1_joint
          - l_two_cyl_finger2_joint
        calibration_joint_positions: [0.0, 0.0]
        support_joint: l_two_cyl_finger1_joint
        support_contact_link: l_two_cyl_finger1
        support_contact_point_local: [0.0, 0.0, -0.075]
        # finger1 joint origin [0.034,-0.061735,-0.2935] + 杆端局部偏移。
        support_contact_point_base_at_zero: [0.034, -0.061735, -0.3685]
        support_retracted_position: 0.0
        # 支撑 0.030 与夹爪 0.010 后两根杆端的工具轴坐标同为 -0.3985，
        # 轴向齐平 → 同一工作位姿下钩爪贴把手立板（z 0.952 带）、支撑杆端同时
        # 到达同侧缝口平面（x 0.099）；进入深度由 live 封定（AGENT §4.3）。
        support_contact_position: 0.030
        gripper_joint: l_two_cyl_finger2_joint
        gripper_contact_link: l_two_cyl_finger2
        gripper_contact_point_local: [0.0, 0.0, -0.095]
        gripper_contact_point_base_at_zero: [-0.034, -0.061735, -0.3885]
        gripper_open_position: 0.0
        gripper_grasp_position: 0.010
        # 2026-09-04 AGENT §8.4 fix#3 (cap2 verify3 取证): 钩爪封定 = 深压 +
        # 座封探针，替代旧「到达 grasp + 稳定性窗口」—— 浅 perch(0.010,
        # ≤0.87mm/3N)永不啮合且必然失稳。啮合需 ≥1mm/≥10N：press 证据 =
        # grasp+0.0015(杆位 0.0115, ~1.5mm 面深, ref 0.015 让 I 爬到 ~10N)；
        # 座封 ref = grasp−0.004(杆位 0.006, 双侧同时回缩拖抽屉至 latch 止点
        # ~0.0038 后爪停低张力区)；catch_floor 0.0005 为啮合判别量(未啮合爪
        # 自由落回 0.006)。最终偏移写入 YAML，不能靠扩大抓取容差。
        gripper_hook_press_overshoot: 0.005
        gripper_hook_press_penetration_evidence: 0.0015
        gripper_hook_seat_depth: 0.004
        gripper_hook_seat_catch_floor: 0.0005
      right:
        move_group: right_arm
        contact_tool_link: r_three_cyl_base
        transport_named_target: home
        tool_roll_offset: 0.0
        tool_tip_position: [0.0265, -0.061735, -0.3885]
        calibration_joint_names:
          - r_three_cyl_finger1_joint
          - r_three_cyl_finger2_joint
          - r_three_cyl_finger3_joint
        calibration_joint_positions: [0.0, 0.0, 0.0]
        support_joint: r_three_cyl_finger2_joint
        support_contact_link: r_three_cyl_finger2
        support_contact_point_local: [0.0, 0.0, -0.075]
        support_contact_point_base_at_zero: [-0.034, -0.061735, -0.3685]
        support_retracted_position: 0.0
        support_contact_position: 0.030
        gripper_joint: r_three_cyl_finger1_joint
        gripper_contact_link: r_three_cyl_finger1
        gripper_contact_point_local: [0.0, 0.0, -0.090]
        gripper_contact_point_base_at_zero: [0.034, -0.061735, -0.3885]
        gripper_open_position: 0.0
        gripper_grasp_position: 0.010
        # 2026-09-04 AGENT §8.4 fix#3: 同左侧(见 drawer_tools.left 的注释)。
        gripper_hook_press_overshoot: 0.005
        gripper_hook_press_penetration_evidence: 0.0015
        gripper_hook_seat_depth: 0.004
        gripper_hook_seat_catch_floor: 0.0005
        # finger3 是 finger2 的串联子级：base 零位杆端 =
        # [-0.034,-0.061735,-0.2935] + [-0.012,0.082,-0.05245]
        # + [0,0,-0.013002]。解锁位姿按这根真实短杆计算并由插件核验。
        unlock_joint: r_three_cyl_finger3_joint
        unlock_contact_link: r_three_cyl_finger3
        unlock_contact_point_local: [0.0, 0.0, -0.013002]
        unlock_contact_point_base_at_zero: [-0.046, 0.020265, -0.358952]
    navigation_takeover_distance: 1.0
    navigation_takeover_yaw_tolerance: 0.35
    navigation_takeover_stall_timeout: 4.0
    docking_timeout: 45.0
    docking_position_tolerance: 0.008
    docking_yaw_tolerance: 0.070
    docking_max_linear_speed: 0.15
    docking_max_angular_speed: 0.45
    docking_linear_gain: 0.8
    docking_angular_gain: 1.2
    operation_lease_service: /xczs/operation_lease
    operation_lease_duration: 3.0
    operation_lease_renew_period: 0.75
    operation_lease_request_timeout: 0.50
    force_tracking_tolerance: 0.00005
    force_tracking_max_compensation: 0.0010
    force_tracking_settle_seconds: 0.15
    force_tracking_attempts: 3
    button_press_minimum_cartesian_fraction: 0.95
    # 真实移动杆端到目标点的硬门槛；任一侧超差立即收杆并终止，不再带着
    # 错位接触进入附着或抽拉。
    drawer_support_contact_tolerance: 0.008
    drawer_gripper_contact_tolerance: 0.008
    drawer_arm_pose_tolerance: 0.008
    drawer_arm_orientation_tolerance: 0.02
    drawer_arm_stability_tolerance: 0.003
    # 抽屉正面工位：夹具局部系 == 世界/map 系（场景模型单位位姿 spawn）。
    # 停靠点 = 抽屉前脸（x=0.099）正东退让 standoff；outward (1,0,0) 自前脸
    # 指向机器人（东侧）。base_yaw_offset 取 0：导航目标 yaw = atan2(-1,0,0
    # 反)-0 = π，机器人正对面板（朝西），右臂自东向西伸到前脸，grasp 固定
    # 关节附着后沿滑动轴拉出（向东）/ 推回（向西）。
    # 可达性复标（2026-09-01 Gazebo /compute_ik）：双臂对 ready/grasp/support
    # 位姿在机器人基座 x≈1.50 时无 IK 解（NO_IK_SOLUTION），x≤1.30 可解。
    # 为留足停靠容差余量，四站 standoff 统一 1.1（机器人基座 x=1.199，相对
    # 前脸 x=0.099 退让 1.10m，双臂可达余量 ~0.1m）。
    controls:
      db1:
        navigation_station:
          local_anchor: [0.099, 4.4, 0.0]
          outward_axis: [1.0, 0.0, 0.0]
          standoff: 1.1
          base_yaw_offset: 0.0
          frame_id: map
      dm1:
        navigation_station:
          local_anchor: [0.099, 5.2, 0.0]
          outward_axis: [1.0, 0.0, 0.0]
          standoff: 1.1
          base_yaw_offset: 0.0
          frame_id: map
      ds1:
        # 高抽屉不可达：工位仅供 Web 状态展示与实时规划验证（validation-only
        # 目标同样要导航），operator 不会执行任何抽拉（不在 operable 清单）。
        navigation_station:
          local_anchor: [0.099, 4.581, 0.0]
          outward_axis: [1.0, 0.0, 0.0]
          standoff: 1.1
          base_yaw_offset: 0.0
          frame_id: map
        unavailable_reason: >-
          高抽屉（把手世界 z≈2.00 m）超出右臂可达窗口上缘 1.547 m，模型物理
          不可达；保留停靠工位仅供状态展示与实时规划验证，不执行抽拉操作。
      ds2:
        navigation_station:
          local_anchor: [0.099, 4.219, 0.0]
          outward_axis: [1.0, 0.0, 0.0]
          standoff: 1.1
          base_yaw_offset: 0.0
          frame_id: map
      ds3:
        navigation_station:
          local_anchor: [0.099, 5.381, 0.0]
          outward_axis: [1.0, 0.0, 0.0]
          standoff: 1.1
          base_yaw_offset: 0.0
          frame_id: map
    # 物理执行能力正向清单（AGENT P3 起：db1 抽屉为本阶段唯一 drawer 流程
    # 操作对象；dm1/ds2/ds3 维持既有 slider 语义待 AGENT §9 推广）。ds1 高
    # 抽屉不可达 → 仅状态展示，工位与原因见 controls.ds1。
    # 未列入的控制一律只做实时规划验证，绝不写入夹具状态。
    operable_control_ids:
      - db1
      - dm1
      - ds2
      - ds3
    inoperable_control_reason: >-
      电气夹层 ds1 高抽屉本阶段为状态展示控制（前脸 z=2.06m，超出右臂可达窗口
      0.58~1.547m 上缘）。未列入控件仅保留状态显示和实时规划验证，不会执行
      抽拉操作。
    toolset_mismatch_reason: >-
      当前工具套装未挂载该控件所需的操作工具（套装 A：三电缸/两电缸；
      套装 B：旋转按钮/摇杆）。控件仍保留状态显示；错套装请求会在导航和
      机械臂归位前直接失败并返回 toolset_mismatch。可在 Web 一键切换末端
      套装；切换到对应套装后，若控件已完成适配器验收才可物理执行。

/xczs_operation_lease_coordinator:
  ros__parameters:
    service_name: /xczs/operation_lease
    maximum_lease_duration: 5.0
