/**:
  ros__parameters:
    # 电气夹层 3.0 场景夹具的可操作控件目录（跨层合同，B3b 定稿，正面抽拉改版）。
    # 坐标均位于夹具局部系 electrical_mezzanine_frame（场景模型以单位位姿
    # spawn，故局部系 == 世界/map 系）；位置单位为 m，转角单位为 rad。
    # 五扇抽屉（ds1/ds2/db1/ds3/dm1）为正面抽拉抽屉：从东侧（正面）停靠，
    # grasp 固定关节把三电缸探针刚性附着到面板前脸（x=0.099），再沿滑动轴
    # 拖拽 —— 拉出到 detent 0.3 = 打开，推回到 0 = 关闭。grasp_operated=true
    # 让 operator 走 grasp-drag 分支；local_position = 面板前脸中心（= 关节
    # 原点 + 面板 bbox 中心，与 xacro grasp_point 在零位重合）；approach_normal
    # = [1,0,0] 指向东（机器人侧），工具自正面逼近面板。
    control_ids:
      - ds1
      - ds2
      - db1
      - ds3
      - dm1

    controls:
      ds1:
        type: slider
        display_name: "ds1 抽屉"
        joint_name: ds1
        local_position: [0.099, 4.581, 2.06]
        axis: [1.0, 0.0, 0.0]
        approach_normal: [1.0, 0.0, 0.0]
        grasp_operated: true
        min_position: 0.0
        max_position: 0.38
        state_ids: ["closed", "open"]
        state_labels: ["关闭", "打开"]
        state_positions: [0.0, 0.3]
      ds2:
        type: slider
        display_name: "ds2 抽屉"
        joint_name: ds2
        local_position: [0.099, 4.219, 1.52]
        axis: [1.0, 0.0, 0.0]
        approach_normal: [1.0, 0.0, 0.0]
        grasp_operated: true
        min_position: 0.0
        max_position: 0.38
        state_ids: ["closed", "open"]
        state_labels: ["关闭", "打开"]
        state_positions: [0.0, 0.3]
      db1:
        type: drawer
        display_name: "db1 抽拉柜"
        joint_name: db1
        local_position: [0.099, 4.4, 0.952]
        axis: [1.0, 0.0, 0.0]
        approach_normal: [1.0, 0.0, 0.0]
        min_position: 0.0
        max_position: 0.38
        state_ids: ["closed", "open"]
        state_labels: ["关闭", "打开"]
        state_positions: [0.0, 0.07]
        # 双手抽拉几何合同（2026-09-09 用户目视裁决：把手 = b1.STL 原生两条竖向
        # 立筋，外加横杆/短横杆已删；b1p 恢复真实可按解锁按钮；世界坐标 = b1 关位
        # q0，b1 根 (0.030,4.047,0.83187)，立筋前脸/面板前缘 x0.099。完整几何
        # 源/换型史见 xacro b1 link 注释块）。
        #   钩把手 = 两条原生竖向立筋（16mm 宽 × 96mm 高）：b1 局部 L
        #   y0.052..0.068 / R y0.638..0.654、z0.072..0.168 = 世界 y 4.099..4.115 /
        #   4.685..4.701、z 0.904..1.000，前脸贴 x0.099 平面。grasp 锚点（左/右
        #   handle point）= 立筋中心：world x0.099、y 4.107/4.693、z 0.952 —— 与
        #   插件 grasp_point/right_grasp_point 同点零改动，钩端压贴立筋前脸得力
        #   ≥8N 照旧（plugin 附着门 grasp_contact_threshold 0.02 以该锚为基准）。
        #   支撑点 = 柜体左右侧缝（AGENT §4.3 封定族）：左侧缝 y 4.039、右侧缝
        #   y 4.761，z 0.952、x 面板前缘 0.099；支撑杆进入深度沿 −X，活体自标定
        #   support_contact_inset 见 adapter drawer_tools。016 两侧 flank panel
        #   真实挡停支撑，支撑段不动。
        #   解锁（2026-09-09 恢复「真实可按按钮」版，废止 §4.2/§4.4 sim/平齐面）：
        #   b1p 已拆为 b1 上独立可压红帽（b1p_joint，0..12mm 朝柜内 −X，plugin
        #   db1_unlock_button pressed 物证 Position ≥ 0.0035）；按钮外端面中心
        #   b1 局部 (0.069,0.646,0.1705) = 世界 unlock_press_point (0.099,4.693,
        #   1.002)，位于 R 竖立筋顶缘上方（立筋中心 z0.952）。plugin 解锁门 = finger3 端点距
        #   unlock_press_point ≤ 0.010 + b1p_joint Position ≥ press_threshold +
        #   左右钩杆端保持 + 有效租约会话；simulated_linkage/simulation_acceptance
        #   已从插件撤除，绝不仿真放行。
        #   解锁电机驱动：operator 直接向三电缸控制器发全关节 FJT（电机关节 + 其余
        #   手指保持标定位），读回真实电机位置 ∈ [retracted+floor, ceiling) 才调
        #   解锁服务（插件同条件校验），不达标即响亮失败、绝不盲解锁。工具几何/标定
        #   仍见 electrical_mezzanine_adapter.yaml drawer_tools.right。
        drawer_axis: [1.0, 0.0, 0.0]
        left_handle_point: [0.099, 4.107, 0.952]
        right_handle_point: [0.099, 4.693, 0.952]
        # 两工具在各自滚转角下，支撑杆列均比夹爪杆列远离把手 0.068m（列间距），
        # 与「把手钩点—侧缝支撑点」横向间距 0.068 匹配；同一工作位姿下钩爪贴
        # 把手、支撑杆对缝口（一姿态多接触门）。
        left_support_point: [0.099, 4.039, 0.952]
        right_support_point: [0.099, 4.761, 0.952]
        unlock_press_point: [0.099, 4.693, 1.002]
        # ---- 解锁电机（右侧三电缸 finger3）契约（与插件 <control> 同源） ----
        # unlock_extension_floor/ceiling 与插件一致（floor=1mm 即视为伸出，
        # ceiling=25.4mm 行程上限不可撞）；pressed 为电机作业目标伸出量（现 8mm，
        # 须满足 retracted+floor ≤ pressed < ceiling；按压须把 b1p 帽按入
        # ≥3.5mm，见插件 db1_unlock_button press_threshold）。
        unlock_motor_joint: r_three_cyl_finger3_joint
        unlock_retracted_position: 0.0
        unlock_pressed_position: 0.008
        unlock_extension_floor: 0.001
        unlock_extension_ceiling: 0.0254
        # 抓取/支撑位姿在面板前缘正东 drawer_grasp_outward_offset 0.005m；抓取时
        # 左右探针再向里压入 drawer_grasp_press_depth 2mm 压贴前脸（真实接触）。
        # plugin 附着门收紧到 grasp_contact_threshold 0.02，悬空假附着被拒；
        # 耦合拖拽期间 plugin 实时校验尖端仍贴住把手，脱离超 0.5s 即中止。
        drawer_grasp_outward_offset: 0.005
        drawer_grasp_press_depth: 0.002
        # 解锁按压：finger3 自「右钩住+右支撑入缝」的同一工作位姿伸出，不移动整臂。
        # drawer_unlock_approach_offset 为 finger3 接触点在按钮东侧的悬停退让初值
        # （旧整臂 approach-dance 已废止，保留该键仅为 007 兼容过渡）；每步伸出后
        # operator 以真实电机关节位置核验达标才调解锁服务；真按入最终物证 = 插件
        # 读 b1p_joint Position（≥ 0.0035）。finger3 端点距 unlock_press_point
        # 的距离门与插件 unlock_distance_threshold 同源（0.010，覆盖按钮真实压入
        # 时外端面的内缩）；到上限仍不达标即响亮失败，不盲解锁。整臂按压
        # drawer_unlock_press_depth 语义已删除。
        drawer_unlock_approach_offset: 0.04
        drawer_unlock_distance_threshold: 0.010
        drawer_sync_tolerance: 0.05
      ds3:
        type: slider
        display_name: "ds3 抽屉"
        joint_name: ds3
        local_position: [0.099, 5.381, 1.515]
        axis: [1.0, 0.0, 0.0]
        approach_normal: [1.0, 0.0, 0.0]
        grasp_operated: true
        min_position: 0.0
        max_position: 0.38
        state_ids: ["closed", "open"]
        state_labels: ["关闭", "打开"]
        state_positions: [0.0, 0.3]
      dm1:
        type: slider
        display_name: "dm1 抽屉"
        joint_name: dm1
        local_position: [0.099, 5.2, 0.955]
        axis: [1.0, 0.0, 0.0]
        approach_normal: [1.0, 0.0, 0.0]
        grasp_operated: true
        min_position: 0.0
        max_position: 0.38
        state_ids: ["closed", "open"]
        state_labels: ["关闭", "打开"]
        state_positions: [0.0, 0.3]

    # 类型默认值（按钮逐项覆盖 axis/approach/limits）。
    button_defaults:
      axis: [1.0, 0.0, 0.0]
      approach_normal: [-1.0, 0.0, 0.0]
      min_position: 0.0
      max_position: 0.3
      spring_stiffness: 12.0
      press_threshold: 0.006
      default_force: 3.59
      state_ids: ["released", "pressed"]
      state_labels: ["关闭", "打开"]
      state_positions: [0.0, 0.3]
    knob_defaults:
      axis: [0.0, 0.0, 1.0]
      approach_normal: [0.0, 0.0, 1.0]
      min_position: -0.78539816339
      max_position: 0.78539816339
      state_ids: ["left", "center", "right"]
      state_labels: ["左档", "中档", "右档"]
      state_positions: [-0.78539816339, 0.0, 0.78539816339]

    # 操作与闭环容差（与共享柜体目录一致；launch 会覆盖 cabinet_frame）。
    cabinet_frame: electrical_mezzanine_frame
    grasp_outward_offset: 0.020
    state_timeout: 1.0
    target_tolerance: 0.035
    stable_velocity_tolerance: 0.03
    stable_state_duration: 0.30
    grasp_attach_settle_duration: 0.15
    grasp_release_settle_duration: 0.30
    door_release_fraction: 0.56
    door_settle_timeout: 90.0
    door_release_position_timeout: 10.0
    door_detent_hysteresis: 0.02
    door_release_position_margin: 0.01
    rotary_pregrasp_clearance: 0.010
    knob_pregrasp_clearance: 0.050
    door_release_clearance: 0.30
    planning_scene_settle_seconds: 0.50
    rotation_waypoint_step: 0.03490658504
    drawer_waypoint_step: 0.03
    cartesian_jump_threshold: 2.0
    cartesian_planning_attempts: 5
    door_cartesian_segment_waypoints: 2
    motion_planning_attempts: 3
