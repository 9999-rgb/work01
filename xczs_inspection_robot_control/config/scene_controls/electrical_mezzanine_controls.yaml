/**:
  ros__parameters:
    # 电气夹层 3.0 场景夹具的可操作控件目录（跨层合同，B3b 定稿）。
    # 坐标均位于夹具局部系 electrical_mezzanine_frame（场景模型以单位位姿
    # spawn，故局部系 == 世界/map 系）；位置单位为 m，转角单位为 rad。
    # 五扇滑门（ds1/ds2/db1/ds3/dm1）为 push-push 闩锁 slider：各取根关节
    # prismatic (1,0,0) 作控制；local_position = 门面板西面（推面）中心 =
    # 关节原点 + 面板 bbox 中心（STL 实测）。开 = 推至 detent 0.3 闩住；
    # 关 = 推过 release 0.34 触发插件释放 → detent 弹簧把面板拉回关闭
    # detent 0（db1 的 B3b live 验证；参数含义见 db1 条目注释）。
    control_ids:
      - ds1
      - ds2
      - db1
      - ds3
      - dm1

    controls:
      ds1:
        type: slider
        display_name: "ds1 门"
        joint_name: ds1
        local_position: [-0.5, 4.581, 2.06]
        axis: [1.0, 0.0, 0.0]
        approach_normal: [-1.0, 0.0, 0.0]
        min_position: 0.0
        max_position: 0.38
        slider_release_position: 0.34
        slider_open_press_offset: 0.02
        slider_close_press_offset: 0.02
        state_ids: ["closed", "open"]
        state_labels: ["关闭", "打开"]
        state_positions: [0.0, 0.3]
      ds2:
        type: slider
        display_name: "ds2 门"
        joint_name: ds2
        local_position: [-0.5, 4.219, 1.52]
        axis: [1.0, 0.0, 0.0]
        approach_normal: [-1.0, 0.0, 0.0]
        min_position: 0.0
        max_position: 0.38
        slider_release_position: 0.34
        slider_open_press_offset: 0.02
        slider_close_press_offset: 0.02
        state_ids: ["closed", "open"]
        state_labels: ["关闭", "打开"]
        state_positions: [0.0, 0.3]
      db1:
        type: slider
        display_name: "db1 门"
        joint_name: db1
        local_position: [-0.5, 4.4, 0.952]
        axis: [1.0, 0.0, 0.0]
        approach_normal: [-1.0, 0.0, 0.0]
        min_position: 0.0
        max_position: 0.38
        # 关闭方向：把已开滑门再往前推过 detent 触发 push-push 释放，弹簧将其
        # 拉回关闭 detent（机器人只能推不能拉，见 B3b 实测）。插件 release
        # （xacro 0.34，此处与之同步）必须严格高于开门按压物理峰值：B3b 实测
        # 工具有效接触面比标定业务点深 ~0.025~0.031 且随按压冲量波动，开门推
        # 至 0.3 目标时面板实际峰值可达 ~0.307~0.332，0.33 会误触发。故
        # slider_open_press_offset 0.02 同时作用于开门初始按压与力闭环目标
        # （均压到 0.28，开门峰值 ≤~0.312，距 release 0.34 留 ~0.028 裕量）。
        # 关门不得把按压目标定为 release 本身：80kg 门按到 release 时正好停在
        # 阈值上（raw ~0.3399x 略低于 0.34），浮点比较不触发，release 保持
        # 未触发、detent 目标仍为 open，弱弹簧（0.48N）拖不动门，close 挂到
        # 90s 超时（boot18）。故 slider_close_press_offset 0.02 加在 release
        # 上，关门按压目标 = 0.36（严格高于 release，且距 max_position 0.38
        # 留行程；关节 upper 0.38 同步），按压中途必然越过 0.34 触发；释放后
        # detent 目标切 closed，~4N 弹簧把门（连同工具）拖回关闭 detent。
        slider_release_position: 0.34
        slider_open_press_offset: 0.02
        slider_close_press_offset: 0.02
        state_ids: ["closed", "open"]
        state_labels: ["关闭", "打开"]
        state_positions: [0.0, 0.3]
      ds3:
        type: slider
        display_name: "ds3 门"
        joint_name: ds3
        local_position: [-0.5, 5.381, 1.515]
        axis: [1.0, 0.0, 0.0]
        approach_normal: [-1.0, 0.0, 0.0]
        min_position: 0.0
        max_position: 0.38
        slider_release_position: 0.34
        slider_open_press_offset: 0.02
        slider_close_press_offset: 0.02
        state_ids: ["closed", "open"]
        state_labels: ["关闭", "打开"]
        state_positions: [0.0, 0.3]
      dm1:
        type: slider
        display_name: "dm1 门"
        joint_name: dm1
        local_position: [-0.5, 5.2, 0.955]
        axis: [1.0, 0.0, 0.0]
        approach_normal: [-1.0, 0.0, 0.0]
        min_position: 0.0
        max_position: 0.38
        slider_release_position: 0.34
        # dm1 的开门工具超程（峰值 - 目标 ≈ 0.060 m）比 db1（≈0.049 m）大约
        # 0.011 m：停靠点 y=5.2 处右臂几何不同，按压冲量更大。offset 0.02 时
        # 开门峰值 ~0.3401 越过 release 0.34，误触发 push-push 释放、门弹回
        # 关闭（boot22 dm1）。本门 offset 取 0.05 → 开门目标 0.25，峰值 ~0.31，
        # 距 release 留 ~0.03 裕量；开门 detent 翻转为 open 只要求越过中点
        # 0.15，0.25 目标足够，验证按 state_id 通过。
        slider_open_press_offset: 0.05
        slider_close_press_offset: 0.02
        state_ids: ["closed", "open"]
        state_labels: ["关闭", "打开"]
        state_positions: [0.0, 0.3]

    # 类型默认值（按钮逐项覆盖 axis/approach/limits）。
    button_defaults:
      axis: [1.0, 0.0, 0.0]
      approach_normal: [-1.0, 0.0, 0.0]
      min_position: 0.0
      max_position: 0.3
      spring_stiffness: 12.0
      press_threshold: 0.006
      default_force: 3.59
      state_ids: ["released", "pressed"]
      state_labels: ["关闭", "打开"]
      state_positions: [0.0, 0.3]
    knob_defaults:
      axis: [0.0, 0.0, 1.0]
      approach_normal: [0.0, 0.0, 1.0]
      min_position: -0.78539816339
      max_position: 0.78539816339
      state_ids: ["left", "center", "right"]
      state_labels: ["左档", "中档", "右档"]
      state_positions: [-0.78539816339, 0.0, 0.78539816339]

    # 操作与闭环容差（与共享柜体目录一致；launch 会覆盖 cabinet_frame）。
    cabinet_frame: electrical_mezzanine_frame
    grasp_outward_offset: 0.020
    state_timeout: 1.0
    target_tolerance: 0.035
    stable_velocity_tolerance: 0.03
    stable_state_duration: 0.30
    grasp_attach_settle_duration: 0.15
    grasp_release_settle_duration: 0.30
    door_release_fraction: 0.56
    door_settle_timeout: 90.0
    door_release_position_timeout: 10.0
    door_detent_hysteresis: 0.02
    door_release_position_margin: 0.01
    rotary_pregrasp_clearance: 0.010
    knob_pregrasp_clearance: 0.050
    door_release_clearance: 0.30
    planning_scene_settle_seconds: 0.50
    rotation_waypoint_step: 0.03490658504
    cartesian_jump_threshold: 2.0
    cartesian_planning_attempts: 5
    door_cartesian_segment_waypoints: 2
    motion_planning_attempts: 3
