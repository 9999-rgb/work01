/**:
  ros__parameters:
    # 跨节点共享的机器人接口契约（与共享 cabinet_robot_adapter.yaml 相同；
    # 本文件为发电机层夹具实例自包含的机器人适配层，避免污染共享柜体配置）。
    # pose_parent_frame 必须为 map：夹具几何随场景以恒等位姿加载于世界/map
    # 系（与电气夹层同型），机器人行走层相对 map 原点存在 z 偏移；挂 odom 会
    # 使 operator 的 map 系目标整体偏低。详见 electrical_mezzanine_adapter.yaml。
    planning_frame: odom
    pose_parent_frame: map
    # 柜体固定于 map；定位修正不应被误判成柜体移动。
    cabinet_verify_frame: map
    manipulation_transform_topic: manipulation_transform
    # 复用现有 Gazebo 物理锚定，防止导航后的 AMCL 偏差进入夹持坐标。
    # 锚点必须刚接且与柜体系同向；经 body 转换，不能假设 world 等于 odom。
    physics_anchor_reference_frame: body
    # 地板原点距操作区约 14–35 m，定位偏航会放大为原点平移；固定地板允许校正。
    physics_anchor_max_shift: 2.0
    physics_anchor_entity: fadianground
    physics_anchor_local_origin: [0.0, 0.0, 0.0]
    manual_linear_axis: y
    manual_linear_sign: -1.0
    navigation_velocity_yaw_offset: -1.57079632679
    allow_embedded_navigation: false
    navigation_frame: map
    navigation_base_frame: base_link
    navigation_action: /navigate_to_pose
    navigation_readiness_service: /lifecycle_manager_navigation/is_active
    navigation_mode_service: /xczs/set_navigation_mode
    navigation_mode_topic: /xczs/navigation_mode
    map_topic: /map
    # 发电机层地板无柜体走廊带；场景 spec 已逐场景置空，此处置 null 兜底。
    navigation_keepout: null
    localization_pose_topic: /amcl_pose
    manual_cmd_vel_topic: /xczs/manual_cmd_vel
    navigation_cmd_vel_topic: /cmd_vel
    base_output_topic: /xczs/cmd_vel
    joint_trajectory_topic: /xczs/joint_trajectory
    joint_state_topic: /xczs/joint_states
    # 夹具场景重置基座位姿 = 场景 robot_spawn（控制柜正面，机头朝 +Y）；
    # 不能沿用柜体场景的 (0,0)（该点在发电机层东墙/地图边界内，导航会被拒）。
    # 2026-09-14 同步：场景出生点已按用户要求由 (-16, 2) 改为 (-13.187, 3.2)
    # （见 scenes.yaml 的 generator_plant.robot_spawn 及其资产副本），本处
    # reset_base_pose 原先没跟着改，会让 /task/reset 把机器人送回旧点。
    # 约定与 electrical_mezzanine_adapter 一致：两处的 x/y/yaw 必须同值。
    reset_base_pose:
      frame_id: map
      x: -13.187
      y: 3.2
      yaw: 1.5707963267948966
    reset_joint_tolerance: 0.12
    reset_joint_timeout_sec: 15.0
    reset_joint_duration_sec: 5.0
    controller_namespace: /xczs
    manual_joint_group_names:
      - left_arm
      - right_arm
      - three_cylinder
      - two_cylinder
      - rocker
      - rotate_button
    manual_joint_groups:
      left_arm:
        - l_arm_0_joint
        - l_arm_1_joint
        - l_arm_2_joint
        - l_arm_3_joint
        - l_arm_4_joint
        - l_arm_5_joint
        - l_arm_6_joint
      right_arm:
        - r_arm_0_joint
        - r_arm_1_joint
        - r_arm_2_joint
        - r_arm_3_joint
        - r_arm_4_joint
        - r_arm_5_joint
        - r_arm_6_joint
      three_cylinder:
        - r_three_cyl_finger1_joint
        - r_three_cyl_finger2_joint
        - r_three_cyl_finger3_joint
      two_cylinder:
        - l_two_cyl_finger1_joint
        - l_two_cyl_finger2_joint
      rocker:
        - l_rocker_rotor_joint
      rotate_button:
        - r_rotbtn_rotate_joint
        - r_rotbtn_jaw1_joint
        - r_rotbtn_jaw2_joint
    manual_joint_groups_by_toolset:
      A:
        - left_arm
        - right_arm
        - three_cylinder
        - two_cylinder
      B:
        - left_arm
        - right_arm
        - rocker
        - rotate_button
    manual_joint_limits:
      l_arm_0_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      l_arm_1_joint: {min_position: -2.8, max_position: 2.8, default_position: -1.4}
      l_arm_2_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      l_arm_3_joint: {min_position: -2.8, max_position: 2.8, default_position: -0.3}
      l_arm_4_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      l_arm_5_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.7}
      l_arm_6_joint: {min_position: -2.8, max_position: 2.8, default_position: -0.85}
      r_arm_0_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      r_arm_1_joint: {min_position: -2.8, max_position: 2.8, default_position: -1.6}
      r_arm_2_joint: {min_position: -2.8, max_position: 2.8, default_position: -0.4}
      r_arm_3_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      r_arm_4_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.0}
      r_arm_5_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.8}
      r_arm_6_joint: {min_position: -2.8, max_position: 2.8, default_position: 0.1}
      r_three_cyl_finger1_joint: {min_position: 0.0, max_position: 0.12, default_position: 0.0}
      r_three_cyl_finger2_joint: {min_position: 0.0, max_position: 0.12, default_position: 0.0}
      r_three_cyl_finger3_joint: {min_position: 0.0, max_position: 0.0254, default_position: 0.0}
      l_two_cyl_finger1_joint: {min_position: 0.0, max_position: 0.12, default_position: 0.0}
      l_two_cyl_finger2_joint: {min_position: 0.0, max_position: 0.12, default_position: 0.0}
      l_rocker_rotor_joint: {min_position: -3.14, max_position: 3.14, default_position: 0.0}
      r_rotbtn_rotate_joint: {min_position: -3.14, max_position: 3.14, default_position: 0.0}
      r_rotbtn_jaw1_joint: {min_position: 0.0, max_position: 0.018, default_position: 0.0}
      r_rotbtn_jaw2_joint: {min_position: 0.0, max_position: 0.018, default_position: 0.0}

/**/xczs_cabinet_button_operator:
  ros__parameters:
    # 机器人适配层：tool_profiles 与全局标定沿用共享柜体目录，仅
    # controls（夹具导航工位）与 operable_control_ids（B1 = fr135_button）
    # 按发电机层夹具定制。
    robot_model_name: xczs_inspection_robot
    move_group_namespace: /
    planning_time: 10.0
    planning_attempts: 10
    planning_velocity_scale: 0.30
    planning_acceleration_scale: 0.30
    goal_position_tolerance: 0.0005
    goal_orientation_tolerance: 0.01
    goal_joint_tolerance: 0.001
    allow_replanning: true
    press_depth: 0.008
    prepress_distance: 0.12
    docking_base_frame: body
    docking_base_footprint: [-0.42, -0.42, -0.42, 0.42, 0.55, 0.42, 0.55, -0.42]
    docking_base_footprint_padding: 0.03
    grasp_brake_link: body
    # 标定关节闭合位有 ODE 接触静差（实测 ~4mm），0.003 贴边界会误报校准
    # 失败；放宽到 0.006 覆盖静差。对抓取影响可忽略（附着容差 0.12m）。
    tool_tip_calibration_joint_tolerance: 0.006
    # 闭合值是分步跟随的行程上限；实际位置由方板接触决定。
    # 双侧实接触和压入深度/持续时间保护独立于关节读回容差。
    knob_gripper:
      joint_names: [r_rotbtn_rotate_joint, r_rotbtn_jaw1_joint, r_rotbtn_jaw2_joint]
      open_positions: [0.0, 0.0, 0.0]
      closed_positions: [0.0, 0.0145, 0.0145]
      tolerances: [0.01, 0.0032, 0.0032]
    tool_profiles:
      button:
        move_group: right_arm
        contact_tool_link: r_rotbtn_probe_tip
        transport_named_target: home
        tool_tip_position: [0.0, 0.0, 0.0]
      knob:
        move_group: right_arm
        contact_tool_link: r_rotbtn_body
        grasp_link: r_rotbtn_rotate
        transport_named_target: home
        tool_axis_orientation: toward_control
        # 夹持点在旋转盘局部 z=38 mm；旧 16 mm 落在钳口根部。
        # 物理锚定已消除定位偏差，规划点与旋转盘真实几何中心一致。
        tool_tip_position: [-0.06128, -0.006, 0.2105]
        grasp_point_position: [0.0, 0.0, 0.038]
      # 连续旋转插口使用第二套左侧摇杆；door 保留公共配置合同。
      switch:
        move_group: left_arm
        contact_tool_link: l_rocker_body
        grasp_link: l_rocker_rotor
        transport_named_target: home
        tool_axis_orientation: toward_control
        tool_tip_position: [-0.01, -0.07, 0.2611]
      door:
        move_group: right_arm
        contact_tool_link: r_three_cyl_base
        grasp_point_position: [0.0265, -0.061735, -0.3885]
        transport_named_target: home
        tool_tip_position: [0.0265, -0.061735, -0.3885]
        calibration_joint_names:
          - r_three_cyl_finger1_joint
          - r_three_cyl_finger2_joint
          - r_three_cyl_finger3_joint
        calibration_joint_positions: [0.0, 0.0, 0.0]
    navigation_takeover_distance: 1.0
    navigation_takeover_yaw_tolerance: 0.35
    navigation_takeover_stall_timeout: 4.0
    docking_timeout: 45.0
    docking_position_tolerance: 0.008
    docking_yaw_tolerance: 0.070
    docking_max_linear_speed: 0.15
    docking_max_angular_speed: 0.45
    docking_linear_gain: 0.8
    docking_angular_gain: 1.2
    operation_lease_service: /xczs/operation_lease
    operation_lease_duration: 3.0
    operation_lease_renew_period: 0.75
    operation_lease_request_timeout: 0.50
    force_tracking_tolerance: 0.00005
    force_tracking_max_compensation: 0.0010
    force_tracking_settle_seconds: 0.15
    force_tracking_attempts: 3
    button_press_minimum_cartesian_fraction: 0.95
    # 夹具按钮工位：夹具局部系 == 世界/map 系（场景模型单位位姿 spawn）。
    # 停靠点 = 按钮面正南退让 standoff；outward (0,-1,0) 自按钮指向机器人。
    # 机器人本体双臂为前后布局（右臂挂 body -X 即"后背"侧），机头朝 -Y
    # （body_yaw=270°，base_yaw_offset=π/2）时右臂肩部恰在按钮正南 ~0.56m，
    # prepress 目标距肩仅 ~0.08m，按压姿态在右臂可达域内（live IK 已验证；
    # bwo=0 的 body_yaw=180° 下按钮位于右臂 0.98m 斜对角，超出关节限位）。
    # standoff 0.914 沿用柜体；local_anchor z 取 0（贴地），Nav2/精停只消费 x/y/yaw。
    controls:
      frb:
        # 绕插入轴偏转 45°，为摇杆壳体和腕部留出柜面间隙。
        tool_roll_offset: -0.7853981633974483
        # 源摇杆网格的方孔相对转子坐标旋转 30°，插入前补偿该角度。
        rotor_alignment_offset: -0.5235987755982988
        ready_joint_seed:
          joint_names: [l_arm_0_joint, l_arm_1_joint, l_arm_2_joint, l_arm_3_joint, l_arm_4_joint, l_arm_5_joint, l_arm_6_joint]
          positions: [1.0281900799, 1.8819511043, -1.4735500508, 1.8165353165, -2.8167100497, 0.0201943968, -1.5861171992]
        navigation_station:
          local_anchor: [-14.812, 4.7833, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.0
          base_yaw_offset: -1.5707963267948966
          frame_id: map
        grasp_outward_offset: 0.004
        rotary_retreat_distance: 0.12
      fbutton1:
        # 实测成功的按压姿态作为起点；执行前验证接近、按压和退出整段路径。
        ready_joint_seed:
          joint_names: [r_arm_0_joint, r_arm_1_joint, r_arm_2_joint, r_arm_3_joint, r_arm_4_joint, r_arm_5_joint, r_arm_6_joint]
          positions: [-2.75468, -0.65948, -2.53624, 1.48148, -2.20585, 2.68849, -0.49518]
        navigation_station:
          local_anchor: [-16.275, 4.7833, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.0
          base_yaw_offset: 1.5707963267948966
          frame_id: map
      fbutton2:
        # 实测成功的按压姿态作为起点；执行前验证接近、按压和退出整段路径。
        ready_joint_seed:
          joint_names: [r_arm_0_joint, r_arm_1_joint, r_arm_2_joint, r_arm_3_joint, r_arm_4_joint, r_arm_5_joint, r_arm_6_joint]
          positions: [-2.75468, -0.65948, -2.53624, 1.48148, -2.20585, 2.68849, -0.49518]
        navigation_station:
          local_anchor: [-16.375, 4.7833, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.0
          base_yaw_offset: 1.5707963267948966
          frame_id: map
      fbutton3:
        # 实测成功的按压姿态作为起点；执行前验证接近、按压和退出整段路径。
        ready_joint_seed:
          joint_names: [r_arm_0_joint, r_arm_1_joint, r_arm_2_joint, r_arm_3_joint, r_arm_4_joint, r_arm_5_joint, r_arm_6_joint]
          positions: [-2.75468, -0.65948, -2.53624, 1.48148, -2.20585, 2.68849, -0.49518]
        navigation_station:
          local_anchor: [-16.475, 4.7833, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.0
          base_yaw_offset: 1.5707963267948966
          frame_id: map
      fbutton4:
        # 实测成功的按压姿态作为起点；执行前验证接近、按压和退出整段路径。
        ready_joint_seed:
          joint_names: [r_arm_0_joint, r_arm_1_joint, r_arm_2_joint, r_arm_3_joint, r_arm_4_joint, r_arm_5_joint, r_arm_6_joint]
          positions: [-2.75468, -0.65948, -2.53624, 1.48148, -2.20585, 2.68849, -0.49518]
        navigation_station:
          local_anchor: [-16.575, 4.7833, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.0
          base_yaw_offset: 1.5707963267948966
          frame_id: map
      # 2026-09-14 用户裁决修正：工位方向原先全错。
      # `approach_normal`（12 个控件全是 [0,-1,0]）是**工具逼近控件的方向**，
      # 因此机器人站位应在控件的 +Y（北）侧；而 `outward_axis` 是**从控件指向
      # 机器人站位**的方向，本应是 approach_normal 的反向。原值 [0,-1,0] 与
      # approach_normal 同向，把机器人放到了南侧——那里隔着柜体实体墙带
      # （y∈[3.97,4.82]，高 2.26m），机械臂必须穿过墙带去够控件，且规划场景
      # 里没有这堵墙，MoveIt 就直着规划过去 → 一直穿模。故 12 个控件统一改为
      # [0,+1,0]（北侧）。
      fr135_button:
        navigation_station:
          local_anchor: [-13.1867, 4.8113, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          # standoff 1.4：prepress 目标位于右臂可达域内部（live /plan_kinematic_path 0.042s 成功）。
          # 原 0.914 下右臂 r_arm_4=+3.001 距 3.14 限位仅 0.14rad，OMPL 目标盒采样
          # （位置 ±5mm 且朝向 ±0.01rad 组合）越限 → "Unable to sample any valid states"。
          standoff: 1.4
          base_yaw_offset: 1.5707963267948966
          frame_id: map
      fr2222_button:
        navigation_station:
          local_anchor: [-13.7867, 4.8113, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          # 沿用 fr135 验证过的停靠几何：body_yaw=270°（bwo=π/2）下右臂肩部
          # 在按钮正南 ~0.56m，prepress 目标在右臂可达域内（bwo=0 时按钮在
          # 0.98m 斜对角，OMPL 目标盒采样越限）。
          standoff: 1.4
          base_yaw_offset: 1.5707963267948966
          frame_id: map
      fr4332_button:
        navigation_station:
          local_anchor: [-15.4567, 4.8113, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.4
          base_yaw_offset: 1.5707963267948966
          frame_id: map
      fr12452_button:
        navigation_station:
          local_anchor: [-21.9967, 4.8113, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.4
          base_yaw_offset: 1.5707963267948966
          frame_id: map
      fr20422_button:
        navigation_station:
          local_anchor: [-30.1, 4.8113, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.4
          base_yaw_offset: 1.5707963267948966
          frame_id: map
      fr25452_button:
        navigation_station:
          local_anchor: [-35.01, 4.8113, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.4
          base_yaw_offset: 1.5707963267948966
          frame_id: map
      fr135_knob:
        rotary_retreat_distance: 0.04
        navigation_station:
          local_anchor: [-13.1867, 4.8113, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.4
          base_yaw_offset: 1.5707963267948966
          frame_id: map
        # 北侧作业面的工具角度补偿；索引 = source*2+target（center=0 turned=1）。
        tool_roll_offsets: [0.7853981633974483, 0.7853981633974483, 0.7853981633974483, 0.7853981633974483]
        # 夹持可见方板的两侧；夹持点位于板厚中部（相对旋钮轴心向外 4 mm）。
        # 与末端局部 z=38 mm 标定配套，钳口在板厚方向重叠 7 mm。
        grasp_outward_offset: 0.004
        # 夹持完成整段旋转弧后释放，随后验证实际档位与恢复结果。
        detent_release_fraction: 1.0
        # box_5 原始语义：七轴冗余臂对同一夹具位姿存在多组 IK，此命名种子已
        # 逐段验证过 ready→pregrasp→50mm 接近→17 点旋转弧；r_arm_0 取负号是
        # 为了避开 center→right 弧末段的自碰撞。⚠️ 该种子与 box_5 的工位几何
        # 绑定（其 local_anchor 经过 /compute_ik 横向对齐扫描），本场景工位不同，
        # 仅作起点；运行时仍按实时 TF 重求 IK。
        ready_joint_seed:
          joint_names:
            - r_arm_0_joint
            - r_arm_1_joint
            - r_arm_2_joint
            - r_arm_3_joint
            - r_arm_4_joint
            - r_arm_5_joint
            - r_arm_6_joint
          positions:
            - -1.221067
            - 1.158552
            - -1.448952
            - -1.806018
            - 1.998380
            - 0.014786
            - -1.656403
      fr2222_knob:
        rotary_retreat_distance: 0.04
        navigation_station:
          local_anchor: [-13.7867, 4.8113, 0.0]
          outward_axis: [0.0, 1.0, 0.0]
          standoff: 1.4
          base_yaw_offset: 1.5707963267948966
          frame_id: map
        # 与 fr135_knob 同规格标定（2026-09-14 用户令「其他旋钮也全部通过测试」）。
        grasp_outward_offset: 0.004
        detent_release_fraction: 1.0
        tool_roll_offsets: [0.7853981633974483, 0.7853981633974483, 0.7853981633974483, 0.7853981633974483]
        ready_joint_seed:
          joint_names:
            - r_arm_0_joint
            - r_arm_1_joint
            - r_arm_2_joint
            - r_arm_3_joint
            - r_arm_4_joint
            - r_arm_5_joint
            - r_arm_6_joint
          positions:
            - -1.221067
            - 1.158552
            - -1.448952
            - -1.806018
