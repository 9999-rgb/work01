/**:
  ros__parameters:
    # 发电机层 3.0 场景夹具的可操作控件目录（跨层合同）。
    # 坐标均位于夹具局部系 generator_plant_frame（场景模型以单位位姿
    # spawn，故局部系 == 世界/map 系）；位置单位为 m，转角单位为 rad。
    # 几何来源：SW2URDF 导出的 r*52（旋钮体）与 r*51（按钮板）STL bbox
    # 校准。按钮 local_position = 按钮受压面中心 = 对应 revolute 关节原点
    # （r1352_1 prismatic 关节在 r1352 内 pose (0,0.007,0)，把按钮 -Y 面
    # 推到 fr* 关节 y=4.8113 处）；旋钮 pivot_position = 关节原点。
    control_ids:
      - fr135_button
      - fr2222_button
      - fr4332_button
      - fr12452_button
      - fr20422_button
      - fr25452_button
      - fr135_knob
      - fr2222_knob
      - fr4332_knob
      - fr12452_knob
      - fr20422_knob
      - fr25452_knob

    controls:
      # ---- 发电机按钮（六组，press 方向 +Y，approach 自南 -Y）----
      fr135_button:
        type: button
        display_name: "fr135 按钮"
        joint_name: r1352_1
        parent_control_id: fr135_knob
        local_position: [-13.1867, 4.8113, 0.691314593]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
        max_position: 0.01
        spring_stiffness: 800.0
        press_threshold: 0.006
        default_force: 5.0
        state_ids: ["released", "pressed"]
        state_labels: ["释放", "按下"]
        state_positions: [0.0, 0.006]
      fr2222_button:
        type: button
        display_name: "fr2222 按钮"
        joint_name: r2222_1
        parent_control_id: fr2222_knob
        local_position: [-13.787, 4.8113, 0.83131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
        max_position: 0.01
        spring_stiffness: 800.0
        press_threshold: 0.006
        default_force: 5.0
        state_ids: ["released", "pressed"]
        state_labels: ["释放", "按下"]
        state_positions: [0.0, 0.006]
      fr4332_button:
        type: button
        display_name: "fr4332 按钮"
        joint_name: r4332_1
        parent_control_id: fr4332_knob
        local_position: [-15.457, 4.8113, 0.69131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
        max_position: 0.01
        spring_stiffness: 800.0
        press_threshold: 0.006
        default_force: 5.0
        state_ids: ["released", "pressed"]
        state_labels: ["释放", "按下"]
        state_positions: [0.0, 0.006]
      fr12452_button:
        type: button
        display_name: "fr12452 按钮"
        joint_name: r12452_1
        parent_control_id: fr12452_knob
        local_position: [-21.997, 4.8113, 0.55131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
        max_position: 0.01
        spring_stiffness: 800.0
        press_threshold: 0.006
        default_force: 5.0
        state_ids: ["released", "pressed"]
        state_labels: ["释放", "按下"]
        state_positions: [0.0, 0.006]
      fr20422_button:
