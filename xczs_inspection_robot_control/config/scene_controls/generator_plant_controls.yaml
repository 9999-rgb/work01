        spring_stiffness: 800.0
        press_threshold: 0.006
        default_force: 5.0
        state_ids: ["released", "pressed"]
        state_labels: ["释放", "按下"]
        state_positions: [0.0, 0.006]

      # ---- 发电机旋钮（六组，revolute 轴(0,1,0) 0→0.8 rad）----
      # 旋钮体 r*52 为 5×14×5 mm 小方块，夹具面板/按钮板承担主要外形。
      # 本阶段旋钮仅作状态展示（graspable=false，不入 operable_control_ids），
      # 几何取关节原点，档位按 0→0.8 三等分；B2 如需旋钮可操作再单独标定抓点。
      fr135_knob:
        type: knob
        display_name: "fr135 旋钮"
        joint_name: fr135
        pivot_position: [-13.1867, 4.8113, 0.691314593]
        local_position: [-13.1867, 4.8113, 0.691314593]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["left", "center", "right"]
        state_labels: ["左档", "中档", "右档"]
        state_positions: [0.0, 0.4, 0.8]
      fr2222_knob:
