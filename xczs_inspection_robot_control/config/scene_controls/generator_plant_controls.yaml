        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["left", "center", "right"]
        state_labels: ["左档", "中档", "右档"]
        state_positions: [0.0, 0.4, 0.8]
      fr25452_knob:
        type: knob
        display_name: "fr25452 旋钮"
        joint_name: fr25452
        pivot_position: [-35.01, 4.8113, 0.551314593]
        local_position: [-35.01, 4.8113, 0.551314593]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["left", "center", "right"]
        state_labels: ["左档", "中档", "右档"]
        state_positions: [0.0, 0.4, 0.8]

    # 类型默认值（沿用共享柜体目录；按钮逐项覆盖 axis/approach/limits）。
    button_defaults:
      axis: [0.0, 0.0, -1.0]
      approach_normal: [0.0, 0.0, 1.0]
      min_position: 0.0
      max_position: 0.008
      spring_stiffness: 800.0
      press_threshold: 0.006
      default_force: 5.0
      state_ids: ["released", "pressed"]
      state_labels: ["释放", "按下"]
      state_positions: [0.0, 0.006]
    knob_defaults:
      axis: [0.0, 0.0, 1.0]
      approach_normal: [0.0, 0.0, 1.0]
      min_position: -0.78539816339
      max_position: 0.78539816339
      state_ids: ["left", "center", "right"]
      state_labels: ["左档", "中档", "右档"]
      state_positions: [-0.78539816339, 0.0, 0.78539816339]

    # 操作与闭环容差（与共享柜体目录一致；launch 会覆盖 cabinet_frame）。
    cabinet_frame: generator_plant_frame
    grasp_outward_offset: 0.020
    state_timeout: 1.0
