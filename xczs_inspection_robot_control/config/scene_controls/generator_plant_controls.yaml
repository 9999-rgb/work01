        state_ids: ["left", "center", "right"]
        state_labels: ["左档", "中档", "右档"]
        state_positions: [0.0, 0.4, 0.8]
      fr4332_knob:
        type: knob
        display_name: "fr4332 旋钮"
        joint_name: fr4332
        pivot_position: [-15.457, 4.8113, 0.69131]
        local_position: [-15.457, 4.8113, 0.69131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["left", "center", "right"]
        state_labels: ["左档", "中档", "右档"]
        state_positions: [0.0, 0.4, 0.8]
      fr12452_knob:
        type: knob
        display_name: "fr12452 旋钮"
        joint_name: fr12452
        pivot_position: [-21.997, 4.8113, 0.55131]
        local_position: [-21.997, 4.8113, 0.55131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["left", "center", "right"]
        state_labels: ["左档", "中档", "右档"]
        state_positions: [0.0, 0.4, 0.8]
      fr20422_knob:
        type: knob
        display_name: "fr20422 旋钮"
        joint_name: fr20422
        pivot_position: [-30.1, 4.8113, 0.55131]
