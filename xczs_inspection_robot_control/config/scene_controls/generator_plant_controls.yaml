        joint_name: r20422_1
        parent_control_id: fr20422_knob
        local_position: [-30.1, 4.8113, 0.55131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
        max_position: 0.01
        spring_stiffness: 800.0
        press_threshold: 0.006
        default_force: 5.0
        state_ids: ["released", "pressed"]
        state_labels: ["释放", "按下"]
        state_positions: [0.0, 0.006]
      fr25452_button:
        type: button
        display_name: "fr25452 按钮"
        joint_name: r25452_1
        parent_control_id: fr25452_knob
        local_position: [-35.01, 4.8113, 0.551314593]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, -1.0, 0.0]
        min_position: 0.0
