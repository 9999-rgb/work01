        type: button
        required_toolset: B
        display_name: "fr20422 旋钮轴向状态"
        joint_name: r20422_1
        parent_control_id: fr20422_knob
        local_position: [-30.1, 4.8113, 0.55131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, 1.0, 0.0]
        min_position: 0.0
        max_position: 0.01
        spring_stiffness: 800.0
        press_threshold: 0.006
        default_force: 5.0
        state_ids: ["released", "pressed"]
        state_labels: ["释放", "按下"]
        state_positions: [0.0, 0.006]
      fr25452_button:
        unavailable_reason: "旋钮插拔轴，由对应旋钮的拉出、旋转、插回流程统一控制。"
        type: button
        required_toolset: B
        display_name: "fr25452 旋钮轴向状态"
        joint_name: r25452_1
        parent_control_id: fr25452_knob
        local_position: [-35.01, 4.8113, 0.551314593]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, 1.0, 0.0]
        min_position: 0.0
        max_position: 0.01
        spring_stiffness: 800.0
        press_threshold: 0.006
        default_force: 5.0
        state_ids: ["released", "pressed"]
        state_labels: ["释放", "按下"]
        state_positions: [0.0, 0.006]

      # 2026-09-14 用户裁决：机器人**在柜体北侧**作业。`approach_normal` 的语义是
      # 「机器人从哪一侧来」，原值 [0,-1,0] 表示从南侧来，与作业面不符 ——
      # operator 会据此把 prepress 预备位姿（grasp + 12~32mm 沿该法向）算到
      # **南边**，等于算进柜体内部，MoveIt 规划必败（实测 0/3，报
      # "could not plan to the prepress pose"）。12 个控件统一翻为 [0,+1,0]。
      # ---- 发电机旋钮（六组，revolute 轴(0,1,0) 0→0.8 rad）----
      # 旋钮体 r*52 为 Ø5×14 mm 圆柱（2026-09-14 更正：此前误记为「5×14×5
      # 小方块」；STL 实测是圆柱，自按钮板前脸 -Y 凸出 7 mm），夹具面板/按钮板
      # 承担主要外形。两档为原始安装角 0° 和沿源模型正向旋转 45°。
      # 2026-09-14 用户令「用套装 B 旋转旋钮」：fr135_knob 升为可操作，已在
      # adapter 的 operable_control_ids 内并补齐标定项（见 generator_plant_adapter.yaml
      # 的 fr135_knob 块）。其余五组仍仅状态展示。
      # 注意 local_position 与 pivot_position 相同是**正确的**：本场景旋钮的
      # 可夹持特征（圆柱）以关节轴为中心，叶片中心即关节原点；共享柜体
      # box_5_knob 的 local_position 有偏移是因为那是 11×65 mm 叶片。
      # 场景 xacro 的 <graspable> 已是 true（旧注释曾写 false，已过期）。
      fr135_knob:
        axial_control_id: fr135_button
        axial_pull_distance: 0.008
        type: knob
        display_name: "fr135 旋钮"
        joint_name: fr135
        pivot_position: [-13.1867, 4.8113, 0.691314593]
        local_position: [-13.1867, 4.8113, 0.691314593]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, 1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["center", "turned"]
        state_labels: ["正中间（0°）", "旋转45°"]
        state_positions: [0.0, 0.7853981633974483]
      fr2222_knob:
        axial_control_id: fr2222_button
        axial_pull_distance: 0.008
        type: knob
        display_name: "fr2222 旋钮"
        joint_name: fr2222
        pivot_position: [-13.7867, 4.8113, 0.83131]
        local_position: [-13.7867, 4.8113, 0.83131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, 1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["center", "turned"]
        state_labels: ["正中间（0°）", "旋转45°"]
        state_positions: [0.0, 0.7853981633974483]
      fr4332_knob:
        axial_control_id: fr4332_button
        axial_pull_distance: 0.008
        type: knob
        display_name: "fr4332 旋钮"
        joint_name: fr4332
        pivot_position: [-15.4567, 4.8113, 0.69131]
        local_position: [-15.4567, 4.8113, 0.69131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, 1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["center", "turned"]
        state_labels: ["正中间（0°）", "旋转45°"]
        state_positions: [0.0, 0.7853981633974483]
      fr12452_knob:
        # 同一次回插额外向内补偿 0.5 mm 静差，轴向关节仍验证回到零位。
        axial_seating_offset: 0.0005
        axial_control_id: fr12452_button
        axial_pull_distance: 0.008
        type: knob
        display_name: "fr12452 旋钮"
        joint_name: fr12452
        pivot_position: [-21.9967, 4.8113, 0.55131]
        local_position: [-21.9967, 4.8113, 0.55131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, 1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["center", "turned"]
        state_labels: ["正中间（0°）", "旋转45°"]
        state_positions: [0.0, 0.7853981633974483]
      fr20422_knob:
        # 同一次回插额外向内补偿 0.5 mm 静差，轴向关节仍验证回到零位。
        axial_seating_offset: 0.0005
        axial_control_id: fr20422_button
        axial_pull_distance: 0.008
        type: knob
        display_name: "fr20422 旋钮"
        joint_name: fr20422
        pivot_position: [-30.1, 4.8113, 0.55131]
        local_position: [-30.1, 4.8113, 0.55131]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, 1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["center", "turned"]
        state_labels: ["正中间（0°）", "旋转45°"]
        state_positions: [0.0, 0.7853981633974483]
      fr25452_knob:
        # 同一次回插额外向内补偿 0.5 mm 静差，轴向关节仍验证回到零位。
        axial_seating_offset: 0.0005
        axial_control_id: fr25452_button
        axial_pull_distance: 0.008
        type: knob
        display_name: "fr25452 旋钮"
        joint_name: fr25452
        pivot_position: [-35.01, 4.8113, 0.551314593]
        local_position: [-35.01, 4.8113, 0.551314593]
        axis: [0.0, 1.0, 0.0]
        approach_normal: [0.0, 1.0, 0.0]
        min_position: 0.0
        max_position: 0.8
        state_ids: ["center", "turned"]
        state_labels: ["正中间（0°）", "旋转45°"]
        state_positions: [0.0, 0.7853981633974483]

    # 类型默认值（沿用共享柜体目录；按钮逐项覆盖 axis/approach/limits）。
    button_defaults:
      axis: [0.0, 0.0, -1.0]
      approach_normal: [0.0, 0.0, 1.0]
      min_position: 0.0
      max_position: 0.008
      spring_stiffness: 800.0
      press_threshold: 0.006
      default_force: 5.0
      state_ids: ["released", "pressed"]
      state_labels: ["释放", "按下"]
      state_positions: [0.0, 0.006]
    knob_defaults:
      axis: [0.0, 0.0, 1.0]
      approach_normal: [0.0, 0.0, 1.0]
      min_position: -0.78539816339
      max_position: 0.7853981633974483
      state_ids: ["center", "turned"]
      state_labels: ["正中间（0°）", "旋转45°"]
      state_positions: [0.0, 0.7853981633974483]

    # 操作与闭环容差（与共享柜体目录一致；launch 会覆盖 cabinet_frame）。
    cabinet_frame: generator_plant_frame
    grasp_outward_offset: 0.020
    state_timeout: 1.0
    # 2026-09-14：0.035 比旋钮的天然死区（实测 0.056 rad，靠重力+干摩擦停住）
    # 还紧，导致接近段只要蹭到旋钮一点点就判 "changed ... before grasp" 中止。
    # 放宽到 0.05：仍在死区内（不会把真位移当没动），档位间距 0.4 有足够余量。
    target_tolerance: 0.05
    # 2026-09-14：0.03 太紧 —— 旋钮靠重力+干摩擦停在死区里，工具接近时的轻微扰动
    # 会让它抖到 0.2 rad/s（位置误差仅 0.009 rad，远在扰动门内），却被判"被扰动"而中止。
    # 放宽到 0.3：仍能识别真实推动（真推是量级更大的持续运动）。
    stable_velocity_tolerance: 0.3
    stable_state_duration: 0.30
    grasp_attach_settle_duration: 0.15
    grasp_release_settle_duration: 0.30
    door_release_fraction: 0.56
    door_settle_timeout: 90.0
    door_release_position_timeout: 10.0
    door_detent_hysteresis: 0.02
    door_release_position_margin: 0.01
    rotary_pregrasp_clearance: 0.010
    knob_pregrasp_clearance: 0.050
    door_release_clearance: 0.30
    planning_scene_settle_seconds: 0.50
    rotation_waypoint_step: 0.03490658504
    cartesian_jump_threshold: 2.0
    cartesian_planning_attempts: 5
    door_cartesian_segment_waypoints: 2
    motion_planning_attempts: 3
