# 小柜钩杆保持不动，由双臂平移5cm；大柜保留支撑联动。
schema_version: 1
sequences:
  db1:
    open:
      display_name: db1 抽拉柜 打开
      steps:
      - type: preposition_base
        control: db1
        cabinet: ''
        toolset: A
      - type: restore_pose
        pose: db1_ready.yaml
        retract_only: true
      - type: translate_tool
        axis: y
        distance: 0.04
        duration: 2.0
        mirror: true
      - type: rod_stroke
        role: gripper
        distance: 0.01875
        duration: 1.0
      - type: translate_tool
        axis: x
        distance: -0.08
        duration: 3.0
      - type: translate_tool
        axis: y
        distance: -0.04
        duration: 2.0
        mirror: true
      - type: rod_stroke
        role: support
        distance: 0.078
        duration: 1.0
      - type: pull_drawer
        control: db1
        target: 0.05
        duration: 3.0
        lead: 0.3
    closed:
