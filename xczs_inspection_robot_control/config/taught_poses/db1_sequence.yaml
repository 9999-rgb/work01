# 电气夹层仿真动作：工位 → 准备 → 张臂 → 伸钩 → 内扣 → 支撑 → 抽拉5cm。
schema_version: 1
sequences:
  db1:
    open:
      display_name: db1 抽拉柜 打开（教学动作）
      steps:
      - type: preposition_base
        control: db1
        cabinet: ''
        toolset: A
      - type: restore_pose
        pose: db1_raised.yaml
        retract_only: true
      - type: translate_tool
        axis: y
        distance: 0.04
        mirror: true
        duration: 1.2
      - type: rod_stroke
        role: gripper
        distance: 0.01875
        duration: 1.0
      - type: translate_tool
        axis: y
        distance: -0.04
        mirror: true
        duration: 1.2
      - type: rod_stroke
        role: support
        distance: 0.08
        duration: 1.0
      - type: pull_drawer
        control: db1
        target: 0.05
        duration: 3.0
        lead: 0.3
    closed:
      display_name: db1 抽拉柜 关闭（教学动作）
      steps:
      - type: restore_pose
        pose: db1_opened.yaml
        retract_only: true
      - type: rod_stroke
        role: gripper
        distance: 0.0
        target: 0.00375
        duration: 1.0
      - type: rod_stroke
        role: support
        distance: 0.0
        target: 0.115
        duration: 1.0
      - type: pull_drawer
        control: db1
        target: 0.0
        duration: 3.0
        lead: 0.3
      - type: retract_rods
      - type: go_home
