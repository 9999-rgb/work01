# db1 抽拉柜「打开」的教学动作序列（声明式）
#
# 背景：原来 db1 的开抽屉动作是**编译进 C++ cabinet_button_operator 的分段状态机**
# （self_center → hook → support → unlock → 播放抽拉）。2026-09-11 用户现场逐步
# 教学出一套更可控的动作（见 db1_teach_node001_raise30.yaml 的调整链），并要求
# 用它替换掉 Web 上原来那套不成熟的操控。
#
# 本文件把那套教学动作写成**声明式步骤**，由 jiang/control_gateway/taught_sequence.py
# 执行。以后现场再教新动作，只要：存一个 taught_poses/*.yaml + 在这里写几行，
# **不用改代码、不用重编**。
#
# 步骤类型（type）：
#   preposition_base  —— 把底盘送到该控件的作业工位（走 scripts/tools/preposition_base.py
#                        的那套：读场景适配 YAML 的 navigation_station）
#   restore_pose      —— 按 taught_poses/*.yaml 下发臂 + 全部电缸杆关节角
#                        （先退杆到 0 → 动臂 → 伸杆到目标；杆目标钳进行程）
#   pull_drawer       —— 联动抽拉：抽屉轨道按时间表被运动学驱动，同时双臂沿世界 +x
#                        平移同样距离、时间轴缩放对齐（视觉合唱，非真实拖拽）
#
# 契约：所有 step 的字段都必须显式给出，缺一个就在加载时报错（不做默认值兜底），
# 免得现场改坏了却静默跑到一半。
schema_version: 1

# 哪些 (控件, 命令) 用本序列。runner 按这个表分派；没有条目的控件维持原路径。
sequences:
  db1:
    open:
      display_name: "db1 抽拉柜 打开（教学动作）"
      steps:
        - type: preposition_base
          control: db1
          # cabinet 留空 = 用序列运行时的 cabinet 名
          cabinet: ""
          toolset: A
        - type: restore_pose
          pose: db1_teach_node001_raise30.yaml
        - type: pull_drawer
          control: db1
          distance: 0.25          # 抽出距离（m），轨道上限 0.38
          duration: 6.0           # 动作时长（s），两边同长
