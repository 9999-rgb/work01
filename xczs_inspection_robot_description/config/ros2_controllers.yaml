/xczs/controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    three_cylinder_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    two_cylinder_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    rocker_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    rotate_button_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/xczs/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/xczs/left_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_arm_0_joint
      - l_arm_1_joint
      - l_arm_2_joint
      - l_arm_3_joint
      - l_arm_4_joint
      - l_arm_5_joint
      - l_arm_6_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      l_arm_0_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_1_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_2_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_3_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_4_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_5_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_6_joint: {trajectory: 0.25, goal: 0.10}

