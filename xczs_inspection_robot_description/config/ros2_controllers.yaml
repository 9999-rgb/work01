/xczs/controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/xczs/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/xczs/arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - body_arm1
      - arm1_arm2
      - arm2_arm3
      - arm3_arm4
      - arm4_arm5
      - arm5_end
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      body_arm1: {trajectory: 0.25, goal: 0.10}
      arm1_arm2: {trajectory: 0.25, goal: 0.10}
      arm2_arm3: {trajectory: 0.25, goal: 0.10}
      arm3_arm4: {trajectory: 0.25, goal: 0.10}
      arm4_arm5: {trajectory: 0.25, goal: 0.10}
      arm5_end: {trajectory: 0.25, goal: 0.10}

/xczs/gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - end_worklink1
      - end_worklink2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      end_worklink1: {trajectory: 0.10, goal: 0.05}
      end_worklink2: {trajectory: 0.10, goal: 0.05}
