# 末端工具套装 B:右旋转按钮机构 rotate_button + 左摇入摇出 rocker。
# 仅声明本套装用到的控制器;Set A 的工具控制器在
# ros2_controllers_toolset_a.yaml 中,两者互斥,由
# ros2_control.xacro 的 $(arg toolset) 决定加载哪一份。
# 控制器名 / 话题名保持与套装无关,消费方不受套装切换影响。
/xczs/controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    rotate_button_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    rocker_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/xczs/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/xczs/left_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_arm_0_joint
      - l_arm_1_joint
      - l_arm_2_joint
      - l_arm_3_joint
      - l_arm_4_joint
      - l_arm_5_joint
      - l_arm_6_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      l_arm_0_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_1_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_2_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_3_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_4_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_5_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_6_joint: {trajectory: 0.25, goal: 0.10}

/xczs/right_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - r_arm_0_joint
      - r_arm_1_joint
      - r_arm_2_joint
      - r_arm_3_joint
      - r_arm_4_joint
      - r_arm_5_joint
      - r_arm_6_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      r_arm_0_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_1_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_2_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_3_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_4_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_5_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_6_joint: {trajectory: 0.25, goal: 0.10}

/xczs/rotate_button_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - r_rotbtn_rotate_joint
      - r_rotbtn_jaw1_joint
      - r_rotbtn_jaw2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      r_rotbtn_rotate_joint: {trajectory: 0.10, goal: 0.05}
      r_rotbtn_jaw1_joint: {trajectory: 0.10, goal: 0.05}
      r_rotbtn_jaw2_joint: {trajectory: 0.10, goal: 0.05}

/xczs/rocker_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_rocker_rotor_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      l_rocker_rotor_joint: {trajectory: 0.10, goal: 0.05}
