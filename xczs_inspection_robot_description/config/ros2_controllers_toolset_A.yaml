# 末端工具套装 A(默认):右三电缸 three_cylinder + 左两电缸 two_cylinder。
# 仅声明本套装用到的控制器;Set B 的工具控制器在
# ros2_controllers_toolset_b.yaml 中,两者互斥,由
# ros2_control.xacro 的 $(arg toolset) 决定加载哪一份。
# 控制器名 / 话题名保持与套装无关(three_cylinder_controller 等),
# 这样 operator / 手动轨迹路由等消费方不受套装切换影响。
/xczs/controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    three_cylinder_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    two_cylinder_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/xczs/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/xczs/left_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_arm_0_joint
      - l_arm_1_joint
      - l_arm_2_joint
      - l_arm_3_joint
      - l_arm_4_joint
      - l_arm_5_joint
      - l_arm_6_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      l_arm_0_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_1_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_2_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_3_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_4_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_5_joint: {trajectory: 0.25, goal: 0.10}
      l_arm_6_joint: {trajectory: 0.25, goal: 0.10}

/xczs/right_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - r_arm_0_joint
      - r_arm_1_joint
      - r_arm_2_joint
      - r_arm_3_joint
      - r_arm_4_joint
      - r_arm_5_joint
      - r_arm_6_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      r_arm_0_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_1_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_2_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_3_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_4_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_5_joint: {trajectory: 0.25, goal: 0.10}
      r_arm_6_joint: {trajectory: 0.25, goal: 0.10}

/xczs/three_cylinder_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - r_three_cyl_finger1_joint
      - r_three_cyl_finger2_joint
      - r_three_cyl_finger3_joint
    command_interfaces:
      # Keep position goals at the public JointTrajectory boundary. The JTC
      # maps its tracking error to effort, avoiding Gazebo Classic's
      # prismatic SetPosition Anchor spam while preserving real motion.
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      r_three_cyl_finger1_joint: {trajectory: 0.10, goal: 0.05}
      r_three_cyl_finger2_joint: {trajectory: 0.10, goal: 0.05}
      r_three_cyl_finger3_joint: {trajectory: 0.02, goal: 0.01}
    gains:
      r_three_cyl_finger1_joint:
        p: 200.0
        d: 4.0
        i: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      r_three_cyl_finger2_joint:
        p: 200.0
        d: 4.0
        i: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      r_three_cyl_finger3_joint:
        p: 200.0
        d: 4.0
        i: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 0.0

/xczs/two_cylinder_controller:
