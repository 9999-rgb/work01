# 末端工具套装 A(默认):右三电缸 three_cylinder + 左两电缸 two_cylinder。
# 仅声明本套装用到的控制器;Set B 的工具控制器在
# ros2_controllers_toolset_b.yaml 中,两者互斥,由
# ros2_control.xacro 的 $(arg toolset) 决定加载哪一份。
# 控制器名 / 话题名保持与套装无关(three_cylinder_controller 等),
# 这样 operator / 手动轨迹路由等消费方不受套装切换影响。
/xczs/controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    three_cylinder_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    two_cylinder_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/xczs/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/xczs/left_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_arm_0_joint
      - l_arm_1_joint
      - l_arm_2_joint
      - l_arm_3_joint
      - l_arm_4_joint
      - l_arm_5_joint
      - l_arm_6_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      # 2026-09-01 收紧：trajectory 0.25/goal 0.10 → 0.05/0.02。原松容差下
      # 微小关节位移可在手臂未物理运动时被判为完成（run4 取证），双臂抽屉
      # 操作会静默失步。位置控制下手臂跟踪误差远小于此值，收紧不影响到位。
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      l_arm_0_joint: {trajectory: 0.05, goal: 0.02}
      l_arm_1_joint: {trajectory: 0.05, goal: 0.02}
      l_arm_2_joint: {trajectory: 0.05, goal: 0.02}
      l_arm_3_joint: {trajectory: 0.05, goal: 0.02}
      l_arm_4_joint: {trajectory: 0.05, goal: 0.02}
      l_arm_5_joint: {trajectory: 0.05, goal: 0.02}
      l_arm_6_joint: {trajectory: 0.05, goal: 0.02}

/xczs/right_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - r_arm_0_joint
      - r_arm_1_joint
      - r_arm_2_joint
      - r_arm_3_joint
      - r_arm_4_joint
      - r_arm_5_joint
      - r_arm_6_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      r_arm_0_joint: {trajectory: 0.05, goal: 0.02}
      r_arm_1_joint: {trajectory: 0.05, goal: 0.02}
      r_arm_2_joint: {trajectory: 0.05, goal: 0.02}
      r_arm_3_joint: {trajectory: 0.05, goal: 0.02}
      r_arm_4_joint: {trajectory: 0.05, goal: 0.02}
      r_arm_5_joint: {trajectory: 0.05, goal: 0.02}
      r_arm_6_joint: {trajectory: 0.05, goal: 0.02}

/xczs/three_cylinder_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - r_three_cyl_finger1_joint
      - r_three_cyl_finger2_joint
      - r_three_cyl_finger3_joint
    command_interfaces:
      # Keep position goals at the public JointTrajectory boundary. The JTC
      # maps its tracking error to effort, avoiding Gazebo Classic's
      # prismatic SetPosition Anchor spam while preserving real motion.
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      r_three_cyl_finger1_joint: {trajectory: 0.10, goal: 0.05}
      r_three_cyl_finger2_joint: {trajectory: 0.10, goal: 0.05}
      # finger3 是 finger2 的子关节，耦合运动使 0.01 的 goal 容差易触发
      # "Exceeded goal_time_tolerance" 中止；放宽到 0.02（operator 自己的
      # 标定校验仍是更严的 ±0.003，此处只影响控制器对轨迹完成的判定）。
      r_three_cyl_finger3_joint: {trajectory: 0.03, goal: 0.02}
    gains:
      # 三缸手指是 0.09–0.11 kg 的棱柱质量块：P=200 且无积分时，重力沿指轴
      # 的分量造成 ~3.5mm 静差，恰在 operator 标定校验容差（±0.003）边界，
      # 停靠/按压姿态下会悬空失败。提高比例增益并加积分项，让控制器在任意
      # 工具姿态下都能把手指可靠钉在业务位姿（0）。数值按各指质量校核过
      # 稳定性（ωn 远低于 100Hz 控制率 Nyquist，ζ≈0.8–0.9）。
      # 2026-09-04 AGENT §8.4 fix（实测根因）：主杆按压行程存在 ~30–45 N
      # 的装配接触静摩擦壁垒 —— 0.05 大指令需 ~40–50 N 才 stick-slip 突破
      # （burst 爬行），0.015 按压级指令被原 i_clamp=10 封在 ~22 N 天花板
      # 下，右钩 r_f1/r_f2 永不到达 evidence ≥ 0.0115（clean2 deep-press
      # 失败物理根因；同源也解释了左钩 l_f2 的 40 s 缓慢爬升）。提高 I 项
      # 权威（i=200、i_clamp=60）：0.015 误差下 ~3 N/s 爬升，约 8–10 sim s
      # 越过壁垒并钉住目标。P/D 不变 → ωn/ζ 不变；误差归零后 I 不累积，
      # 业务位姿（0）的静息校核不受影响。
      r_three_cyl_finger1_joint:
        p: 800.0
        d: 15.0
        i: 200.0
        i_clamp: 60.0
        ff_velocity_scale: 0.0
      r_three_cyl_finger2_joint:
        p: 800.0
        d: 15.0
        i: 200.0
        i_clamp: 60.0
        ff_velocity_scale: 0.0
      r_three_cyl_finger3_joint:
        p: 120.0
        d: 5.0
        i: 40.0
        i_clamp: 5.0
        ff_velocity_scale: 0.0

/xczs/two_cylinder_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_two_cyl_finger1_joint
      - l_two_cyl_finger2_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      l_two_cyl_finger1_joint: {trajectory: 0.10, goal: 0.05}
      l_two_cyl_finger2_joint: {trajectory: 0.10, goal: 0.05}
    gains:
      # 与 three_cylinder 同源问题（2026-09-03 补齐）：两电缸探针在合拢
      # 标定位姿（0）存在重力/静摩擦静差 —— 无积分时 P 项驱动力随误差
      # 趋零，finger2（最深探针）实测静息 0.0055–0.008 m，反复踩在 operator
      # 标定容差（0.006）边界造成校准失败。沿用三缸已验证参数（p=800、
      # i=60/i_clamp=10，ωn 远低于 100Hz 控制率，ζ≈0.8–0.9），把两指可靠
      # 钉在业务位姿（0）；finger1 原有静差即很小，同参不引入新问题。
      # 2026-09-04 AGENT §8.4 fix：与三缸同源的按压行程静摩擦壁垒，沿用
      # 三缸提升后的 I 项权威（i=200、i_clamp=60），使左钩按压不再依赖
      # 40 s 级缓慢爬升（clean2 实测 l_f2 在 22 N 天花板下爬 40 s 才勉强
      # 到达 0.0124，恰好压线 evidence）。
      l_two_cyl_finger1_joint:
        p: 800.0
        d: 15.0
        i: 200.0
        i_clamp: 60.0
        ff_velocity_scale: 0.0
      l_two_cyl_finger2_joint:
        p: 800.0
        d: 15.0
        i: 200.0
        i_clamp: 60.0
        ff_velocity_scale: 0.0
