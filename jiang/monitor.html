<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XCZS 巡操机器人 — 实时监控面板</title>
<!-- 使用 Zenoh REST API SSE → 无需任何第三方 JS 依赖 -->
<style>
  :root {
    --bg: #0f1419;
    --card-bg: #1a2332;
    --border: #2a3a4e;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --cyan: #39d2c0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  /* ── Header ─────────────────────────────── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .header h1 {
    font-size: 22px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .header h1 small {
    font-size: 13px; font-weight: 400; color: var(--text-dim);
  }
  .status-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 16px; border-radius: 20px; font-size: 13px;
    background: var(--card-bg); border: 1px solid var(--border);
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--text-dim);
  }
  .status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.connecting { background: var(--yellow); animation: blink 0.8s infinite; }
  .status-dot.error { background: var(--red); }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* ── Connection Bar ─────────────────────── */
  .connect-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .connect-bar label { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .connect-bar input {
    background: #0d1117; border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; color: var(--text);
    font-size: 14px; width: 130px;
  }
  .connect-bar input:focus { outline: none; border-color: var(--accent); }
  .btn {
    padding: 7px 18px; border-radius: 6px; border: none;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #4a90d9; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #d93a3a; }
  .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover:not(:disabled) { border-color: var(--text-dim); }

  /* ── Layout ─────────────────────────────── */
  .dashboard {
    display: grid; grid-template-columns: 320px 1fr;
    gap: 20px;
  }
  @media (max-width: 900px) {
    .dashboard { grid-template-columns: 1fr; }
  }

  /* ── Sidebar (Topic Manager) ────────────── */
  .sidebar {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px;
  }
  .sidebar h2 { font-size: 15px; margin-bottom: 14px; color: var(--text-dim); }
  .topic-group { margin-bottom: 16px; }
  .topic-group h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-dim); margin-bottom: 8px;
  }
  .topic-preset {
    display: inline-block; padding: 4px 12px; margin: 3px;
    border-radius: 14px; border: 1px solid var(--border);
    font-size: 12px; cursor: pointer; transition: all 0.15s;
    color: var(--text-dim); background: transparent;
  }
  .topic-preset:hover { border-color: var(--accent); color: var(--accent); }
  .topic-preset.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .add-topic-row {
    display: flex; gap: 8px; margin-top: 10px;
  }
  .add-topic-row input {
    flex: 1; background: #0d1117; border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; color: var(--text);
    font-size: 13px;
  }
  .add-topic-row input:focus { outline: none; border-color: var(--accent); }

  .sub-list { margin-top: 12px; }
  .sub-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: 6px; font-size: 13px;
    margin-bottom: 4px; transition: background 0.1s;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }
  .sub-item:hover { background: rgba(255,255,255,0.04); }
  .sub-item .count {
    font-size: 11px; color: var(--text-dim); background: rgba(255,255,255,0.06);
    padding: 1px 7px; border-radius: 10px; margin-left: 8px;
  }
  .sub-item .unsub-btn {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 16px; padding: 0 4px;
    line-height: 1;
  }
  .sub-item .unsub-btn:hover { color: var(--red); }

  /* ── Data Cards ─────────────────────────── */
  .main-panel { min-height: 400px; }
  .main-panel .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 300px;
    color: var(--text-dim); font-size: 15px; gap: 12px;
  }
  .main-panel .empty-state .icon { font-size: 40px; opacity: 0.3; }

  .data-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px;
  }
  .data-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
    transition: border-color 0.2s;
  }
  .data-card:last-child { border-color: var(--accent); }
  .data-card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  .data-card-header .topic-name {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 13px; font-weight: 500;
  }
  .data-card-header .ts {
    font-size: 11px; color: var(--text-dim);
  }
  .data-card-body {
    padding: 14px; overflow-x: auto;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 12.5px; line-height: 1.6;
    max-height: 350px; overflow-y: auto;
  }
  .data-card-body .entry {
    padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .data-card-body .entry:last-child { border-bottom: none; }
  .data-card-body .entry .entry-ts {
    font-size: 10px; color: var(--text-dim);
  }
  .data-card-body .key { color: var(--cyan); }
  .data-card-body .number { color: var(--accent); }
  .data-card-body .string { color: var(--green); }
  .data-card-body .bool { color: var(--purple); }
  .data-card-body .null { color: var(--text-dim); font-style: italic; }

  /* ── Log ────────────────────────────────── */
  .log-panel {
    margin-top: 20px; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 10px;
    max-height: 160px; overflow-y: auto;
    padding: 12px 16px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 12px;
  }
  .log-panel .log-entry {
    padding: 2px 0; color: var(--text-dim);
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .log-panel .log-entry:last-child { border-bottom: none; }
  .log-panel .log-entry .log-ts { color: var(--text-dim); margin-right: 8px; }
  .log-panel .log-entry.info { color: var(--accent); }
  .log-panel .log-entry.ok   { color: var(--green); }
  .log-panel .log-entry.err  { color: var(--red); }
  .log-panel .log-entry.data { color: var(--text); }

  /* ── Toast ──────────────────────────────── */
  .toast-container {
    position: fixed; top: 20px; right: 20px; z-index: 999;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    padding: 10px 18px; border-radius: 8px; font-size: 13px;
    background: var(--card-bg); border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    animation: slideIn 0.25s ease;
    max-width: 360px;
  }
  .toast.err { border-color: var(--red); }
  .toast.ok  { border-color: var(--green); }
  @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>

<!-- ─── Toast ─── -->
<div class="toast-container" id="toastContainer"></div>

<!-- ─── Header ─── -->
<header class="header">
  <h1>
    ⚡ XCZS 巡操机器人
    <small>实时数据监控面板 | Zenoh SSE</small>
  </h1>
  <div class="status-badge">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">未连接</span>
  </div>
</header>

<!-- ─── Connection Bar ─── -->
<div class="connect-bar">
  <label>REST API</label>
  <input type="text" id="restUrl" value="http://localhost:8000" placeholder="http://host:port" style="width:190px">
  <button class="btn btn-primary" id="btnConnect" onclick="doConnect()">连接</button>
  <button class="btn btn-danger" id="btnDisconnect" onclick="doDisconnect()" disabled>断开</button>
  <span style="color:var(--text-dim);font-size:12px;margin-left:auto" id="sessionInfo"></span>
</div>

<!-- ─── Dashboard ─── -->
<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <h2>📡 话题管理</h2>

    <div class="topic-group">
      <h3>⚙️ 底盘与机械臂</h3>
      <button class="topic-preset" data-topic="/xczs/cmd_vel/json">cmd_vel 底盘速度</button>
      <button class="topic-preset" data-topic="/xczs/odom/json">odom 里程计</button>
      <button class="topic-preset" data-topic="/xczs/joint_states/json">joint_states 关节状态</button>
      <button class="topic-preset" data-topic="/xczs/joint_trajectory/json">joint_trajectory 关节指令</button>
    </div>
    <div class="topic-group">
      <h3>📋 任务状态</h3>
      <button class="topic-preset" data-topic="mission/phase/json">mission/phase 任务阶段</button>
      <button class="topic-preset" data-topic="mission/phase">mission/phase (CDR)</button>
    </div>
    <div class="topic-group">
      <h3>🚀 一键订阅</h3>
      <button class="btn btn-primary" onclick="
        subscribe('/xczs/cmd_vel/json');
        subscribe('/xczs/odom/json');
        subscribe('/xczs/joint_states/json');
        subscribe('/xczs/joint_trajectory/json');
      " style="width:100%;margin-top:4px">订阅全部 XCZS 话题</button>
    </div>

    <div class="topic-group">
      <h3>自定义话题</h3>
      <div class="add-topic-row">
        <input type="text" id="customTopic" placeholder="输入话题名，如 robot/status/json"
               onkeydown="if(event.key==='Enter') doSubscribeCustom()">
        <button class="btn btn-primary" onclick="doSubscribeCustom()">订阅</button>
      </div>
    </div>

    <div class="topic-group">
      <h3>已订阅 <span id="subCount" style="font-weight:400;text-transform:none;letter-spacing:0">0</span></h3>
      <div class="sub-list" id="subList">
        <div style="color:var(--text-dim);font-size:12px;padding:8px 0">暂无订阅</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-panel" id="mainPanel">
    <div class="empty-state" id="emptyState">
      <div class="icon">📊</div>
      <div>连接 REST API 后订阅话题，数据将在此显示</div>
      <div style="font-size:12px">通过 Zenoh REST SSE (<code style="color:var(--accent)">/{topic}</code>) 获取实时数据</div>
    </div>
    <div class="data-grid" id="dataGrid" style="display:none"></div>
  </main>
</div>

<!-- ─── Log ─── -->
<div class="log-panel" id="logPanel"></div>

<script>
// ─── State ───────────────────────────────────────────────────
let connected = false;
const subs = new Map();       // topic -> { es, cardId, history:[] }
const historyMax = 50;
let cardCounter = 0;

// ─── DOM refs ────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const statusDot    = $('statusDot');
const statusText   = $('statusText');
const btnConnect   = $('btnConnect');
const btnDisconnect = $('btnDisconnect');
const sessionInfo  = $('sessionInfo');
const subList      = $('subList');
const subCount     = $('subCount');
const dataGrid     = $('dataGrid');
const emptyState   = $('emptyState');
const logPanel     = $('logPanel');
const toastContainer = $('toastContainer');

// ─── Logging ─────────────────────────────────────────────────
function log(level, msg) {
  const el = document.createElement('div');
  el.className = `log-entry ${level}`;
  const ts = new Date().toLocaleTimeString();
  el.innerHTML = `<span class="log-ts">[${ts}]</span>${msg}`;
  logPanel.appendChild(el);
  logPanel.scrollTop = logPanel.scrollHeight;
  while (logPanel.children.length > 100) logPanel.removeChild(logPanel.firstChild);
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  toastContainer.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function setStatus(state, text) {
  statusDot.className = 'status-dot';
  if (state) statusDot.classList.add(state);
  statusText.textContent = text;
}

// ─── Connection ──────────────────────────────────────────────
function doConnect() {
  if (connected) return;
  const baseUrl = ($('restUrl').value || 'http://localhost:8000').trim().replace(/\/+$/, '');
  connected = true;
  setStatus('connected', `已连接 (${baseUrl})`);
  btnConnect.disabled = true;
  btnDisconnect.disabled = false;
  sessionInfo.textContent = baseUrl;
  log('ok', `REST API ${baseUrl}`);
  toast('连接成功');
}

function doDisconnect() {
  if (!connected) return;
  // 关闭所有 EventSource
  for (const [topic, entry] of subs) {
    try { entry.es.close(); } catch (_) {}
  }
  subs.clear();
  dataGrid.innerHTML = '';
  dataGrid.style.display = 'none';
  emptyState.style.display = 'flex';
  connected = false;
  setStatus('', '未连接');
  btnConnect.disabled = false;
  btnDisconnect.disabled = true;
  sessionInfo.textContent = '';
  renderSubList();
  log('info', '已断开');
  toast('已断开');
}

// ─── Subscribe / Unsubscribe ─────────────────────────────────
function subscribe(topic) {
  if (!connected) { toast('请先连接', 'err'); return; }
  if (subs.has(topic)) { toast(`已订阅 ${topic}`, 'err'); return; }

  const baseUrl = ($('restUrl').value || 'http://localhost:8000').trim().replace(/\/+$/, '');
  const url = `${baseUrl}/${topic}`;
  log('info', `Subscribing SSE ${url} …`);

  try {
    const es = new EventSource(url);

    es.onopen = () => {
      log('ok', `SSE 已连接: ${topic}`);
      toast(`✓ ${topic}`);
    };

    es.onmessage = (event) => {
      // SSE 默认 message 事件（非 PUT/DELETE 等命名事件）
    };

    // 监听 PUT 事件（Zenoh REST SSE 主要用 event:PUT）
    es.addEventListener('PUT', (event) => {
      onData(topic, event.data);
    });

    es.onerror = () => {
      log('err', `SSE 错误: ${topic}`);
      // 浏览器会自动重连，但如果是 404 则不会
    };

    subs.set(topic, { es, cardId: null, history: [] });
    renderSubList();
    ensureCard(topic);
  } catch (err) {
    log('err', `订阅失败 ${topic}: ${err.message}`);
    toast(`订阅失败: ${err.message}`, 'err');
  }
}

function unsubscribe(topic) {
  const entry = subs.get(topic);
  if (!entry) return;
  try { entry.es.close(); } catch (_) {}
  subs.delete(topic);
  const card = document.getElementById(`card-${entry.cardId}`);
  if (card) card.remove();
  renderSubList();
  if (dataGrid.children.length === 0) {
    dataGrid.style.display = 'none';
    emptyState.style.display = 'flex';
  }
  log('info', `取消订阅: ${topic}`);
}

function ensureCard(topic) {
  const entry = subs.get(topic);
  if (!entry) return;
  if (entry.cardId && document.getElementById(`card-${entry.cardId}`)) return;
  entry.cardId = ++cardCounter;
  emptyState.style.display = 'none';
  dataGrid.style.display = 'grid';

  const card = document.createElement('div');
  card.className = 'data-card';
  card.id = `card-${entry.cardId}`;
  card.innerHTML =
    `<div class="data-card-header">
      <span class="topic-name">${topic}</span>
      <span class="ts" id="ts-${entry.cardId}">等待数据…</span>
    </div>
    <div class="data-card-body" id="body-${entry.cardId}">
      <div style="color:var(--text-dim);font-size:12px">等待数据…</div>
    </div>`;
  dataGrid.appendChild(card);
}

// ─── Data Handler ────────────────────────────────────────────
function onData(topic, jsonStr) {
  const entry = subs.get(topic);
  if (!entry) return;

  let payload;
  try {
    const outer = JSON.parse(jsonStr);
    // SSE 格式: {"key":"...","value":{实际数据},"encoding":"...","timestamp":"..."}
    payload = outer.value !== undefined ? outer.value : outer;
  } catch (e) {
    payload = { _raw: jsonStr };
  }

  const now = new Date();
  const ts = now.toLocaleTimeString() + '.' + String(now.getMilliseconds()).padStart(3, '0');
  entry.history.push({ ts, data: payload });
  if (entry.history.length > historyMax) entry.history.shift();

  renderCard(topic, entry);
  log('data', `<span style="color:var(--text-dim)">[${ts}]</span> ${topic}`);
}

function renderCard(topic, entry) {
  if (!entry.cardId) return;
  const tsEl = document.getElementById(`ts-${entry.cardId}`);
  const bodyEl = document.getElementById(`body-${entry.cardId}`);
  if (!tsEl || !bodyEl) return;

  const latest = entry.history[entry.history.length - 1];
  tsEl.textContent = latest.ts;

  const show = entry.history.slice(-15).reverse();
  bodyEl.innerHTML = show.map(h => {
    const pretty = syntaxHighlight(JSON.stringify(h.data, null, 2));
    return `<div class="entry"><span class="entry-ts">${h.ts}</span>\n<pre style="margin:2px 0 0 0;white-space:pre-wrap">${pretty}</pre></div>`;
  }).join('');
  bodyEl.scrollTop = 0;
}

function syntaxHighlight(json) {
  return json
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"([^"]+)":/g, '<span class="key">"$1"</span>:')
    .replace(/:\s*(-?\d+\.?\d*(?:e[+-]?\d+)?)/gi, ': <span class="number">$1</span>')
    .replace(/:\s*"([^"]*)"/g, ': <span class="string">"$1"</span>')
    .replace(/:\s*(true|false)/g, ': <span class="bool">$1</span>')
    .replace(/:\s*null/g, ': <span class="null">null</span>');
}

// ─── Render Subscription List ────────────────────────────────
function renderSubList() {
  const keys = Array.from(subs.keys());
  subCount.textContent = keys.length;
  if (keys.length === 0) {
    subList.innerHTML = '<div style="color:var(--text-dim);font-size:12px;padding:8px 0">暂无订阅</div>';
    return;
  }
  subList.innerHTML = keys.map(topic => {
    const entry = subs.get(topic);
    const count = entry ? entry.history.length : 0;
    return `<div class="sub-item">
      <span>${topic}<span class="count">${count}</span></span>
      <button class="unsub-btn" onclick="unsubscribe('${topic}')" title="取消订阅">✕</button>
    </div>`;
  }).join('');
}

// ─── Custom Subscribe ────────────────────────────────────────
function doSubscribeCustom() {
  const input = $('customTopic');
  const topic = input.value.trim();
  if (!topic) return;
  subscribe(topic);
  input.value = '';
}

// ─── Preset Click Handlers ───────────────────────────────────
document.querySelectorAll('.topic-preset').forEach(btn => {
  btn.addEventListener('click', () => {
    subscribe(btn.dataset.topic);
  });
});

// ─── Initial state ───────────────────────────────────────────
log('info', '页面已加载，输入 REST API 地址后点击"连接"');
setStatus('', '未连接');
</script>
</body>
</html>
