      box_5_button_1:
        navigation_station:
          local_anchor: [0.470000, 1.115, 0.000]
          outward_axis: [0.0, 0.0, 1.0]
          standoff: 0.769
          base_yaw_offset: 0.0
          frame_id: map
      box_5_button_2:
        navigation_station:
          local_anchor: [0.520000, 1.115, 0.000]
          outward_axis: [0.0, 0.0, 1.0]
          standoff: 0.769
