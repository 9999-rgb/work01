          outward_axis: [0.0, 0.0, 1.0]
          standoff: 0.769
          base_yaw_offset: 0.0
          frame_id: map
        # 七轴臂对同一夹具位姿存在多组 IK。直压接近(prepress->contact)若落在
        # r_arm_4 为 +2.02 的分支，会卡在腕部翻转奇点附近，Cartesian 路径约 15%
