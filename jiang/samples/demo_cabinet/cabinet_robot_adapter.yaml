    # 物理执行能力采用正向清单，避免新增或漏列控件被默认开放。
    # 每个完成可达、碰撞、接触、状态、无串扰和恢复闭环验收的
    # 控件才可加入该清单，未列控件一律只做实时规划验证。
    # 清单为空时按 ROS 2 参数规则省略该键；节点声明的空 vector 默认值
    # 表示所有控件均为 planning-only，避免 YAML 空数组成为 NOT_SET。
    operable_control_ids:
      - box_6_button_1
      - box_6_button_2
    inoperable_control_reason: >-
      5 号柜旋钮原工位的 0.400 m 退距小于机器人底盘沿柜面法向的半尺寸，
      不满足底盘防碰撞安全包络，现已撤销物理执行权限。其余控件实测仍存在
      末端工具与面板干涉、无运动学解或无碰撞路径，或尚未完成带安全退距的
      物理到档验收。其中 1/2 号柜按钮（顶部，press 工具点高 1.27 m）与
      10/11 号柜按钮（底部，press 工具点贴近地面 0.03/-0.23 m）超出右臂
      在现工位退距下的可达工作空间，OMPL 无法为 prepress 目标采样有效解；
      仅中排 3~8 号柜按钮在右臂肩高附近可达。未列控件仅保留状态显示和实时
      规划验证，不下发机械臂、抓取或柜体写入命令。

