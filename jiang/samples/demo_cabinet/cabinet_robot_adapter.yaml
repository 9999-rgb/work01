          standoff: 0.930
          base_yaw_offset: 0.0
          frame_id: map
      box_5_knob:
        # 历史标定曾为追求 IK 将退距压到 0.400 m，但该值小于底盘
        # 沿柜面法向的半外廓，接近时会先让底盘/工具与柜体产生物理接触。
        # 恢复 0.769 m 安全退距；以下方向标定只供无运动的实时规划诊断，
        # 不得用缩短底盘距离的方式将本控件重新加入物理执行清单。
        tool_roll_offsets:
          - 0.0
          - -0.872664625997
          - 0.0
