<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务历史</title>
<style>
  :root {
    --bg: #0f1419;
    --card-bg: #1a2332;
    --border: #2a3a4e;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --cyan: #39d2c0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 18px 22px;
  }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 600; }
  .login-box { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  input, select, button {
    background: #0d1117; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 10px; font-size: 13px;
  }
  input::placeholder { color: var(--text-dim); }
  button { cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover:not(:disabled) { background: #4a90d9; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .status-line { color: var(--text-dim); font-size: 13px; }
  .status-line.logged-in { color: var(--green); }

  /* 摘要卡 */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
  .card .k { color: var(--text-dim); font-size: 12px; margin-bottom: 6px; }
  .card .v { font-size: 22px; font-weight: 600; }
  .card .v.green { color: var(--green); }
  .card .v.red { color: var(--red); }
  .card .v.cyan { color: var(--cyan); }

  /* 过滤行 */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filters label { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { background: #1e2a3a; color: var(--text-dim); font-weight: 500; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.03); }
  .status-success { color: var(--green); }
  .status-failed { color: var(--red); }
  .status-canceled { color: var(--yellow); }
  .status-running { color: var(--cyan); }
  .empty { text-align: center; color: var(--text-dim); padding: 26px 0; }

  /* 分页 */
  .pager { display: flex; align-items: center; gap: 12px; justify-content: flex-end; margin-top: 12px; font-size: 13px; color: var(--text-dim); }

  /* 详情弹层 */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; width: min(860px, 100%); padding: 18px 20px; }
  .modal h2 { font-size: 15px; margin-bottom: 12px; }
  .modal .close { float: right; background: transparent; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px 16px; margin-bottom: 14px; }
  .kv div { display: flex; gap: 8px; font-size: 13px; }
  .kv .k { color: var(--text-dim); min-width: 74px; }
  .kv .v { word-break: break-all; }
  pre.payload { background: #0d1117; border: 1px solid var(--border); border-radius: 4px; padding: 10px; font-size: 12px; overflow-x: auto; max-height: 220px; color: var(--cyan); margin-bottom: 14px; }
  .timeline { border-top: 1px solid var(--border); padding-top: 8px; }
  .timeline h3 { font-size: 13px; color: var(--text-dim); margin: 8px 0; }
  .tl-row { display: flex; gap: 10px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed rgba(42,58,78,0.5); align-items: baseline; }
  .tl-row .t { color: var(--text-dim); min-width: 88px; }
  .tl-row .phase { color: var(--accent); min-width: 150px; }
  .tl-row .bar { color: var(--cyan); min-width: 56px; }
  .tl-row .msg { color: var(--text-dim); }
  .nav a { color: var(--accent); text-decoration: none; font-size: 13px; margin-right: 12px; }
</style>
</head>
<body>
<header>
  <h1>任务历史</h1>
  <span class="nav"><a href="/monitor.html">监控面板</a></span>
  <div class="login-box">
    <input type="text" id="loginUser" placeholder="用户名" autocomplete="username">
    <input type="password" id="loginPass" placeholder="密码" autocomplete="current-password">
    <button id="loginBtn" class="btn-primary">登录</button>
    <button id="logoutBtn" hidden>退出登录</button>
    <span class="status-line" id="loginStatus">未登录</span>
  </div>
</header>

<div class="cards" id="summaryCards"></div>

<div class="filters">
  <label>类型
    <select id="fType">
      <option value="">全部</option>
      <option value="navigate">导航/巡检</option>
      <option value="operate">操作</option>
    </select>
  </label>
  <label>状态
    <select id="fStatus">
      <option value="">全部</option>
      <option value="success">成功</option>
      <option value="failed">失败</option>
      <option value="canceled">已取消</option>
      <option value="running">运行中</option>
      <option value="accepted">已接受</option>
    </select>
  </label>
  <label>柜体 <input type="text" id="fCabinet" placeholder="如 demo_cabinet"></label>
  <label>控件 <input type="text" id="fControl" placeholder="如 box_3_switch_1"></label>
  <label>失败码 <input type="text" id="fFailure" placeholder="如 operation_timeout"></label>
  <label>开始 <input type="datetime-local" id="fSince"></label>
  <label>结束 <input type="datetime-local" id="fUntil"></label>
  <button id="refreshBtn" class="btn-primary">查询</button>
</div>

<table>
  <thead>
    <tr>
      <th>时间</th><th>类型</th><th>状态</th><th>柜体</th><th>控件</th>
      <th>命令</th><th>失败原因</th><th>耗时(秒)</th><th></th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<div class="pager">
  <button id="prevBtn">上一页</button>
  <span id="pageInfo"></span>
  <button id="nextBtn">下一页</button>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal">
    <button class="close" id="detailClose" aria-label="关闭">×</button>
    <h2 id="detailTitle">任务详情</h2>
    <div id="detailBody"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const ctrlBaseUrl = (() => {
    const proto = window.location.protocol;
    const host = window.location.hostname;
    const port = window.location.port || (proto === 'https:' ? '443' : '8090');
    return `${proto}//${host}:${port}`;
  })();

  let authToken = sessionStorage.getItem('xczs_token') || '';
  let authRequired = true;
  let currentPage = 1;
  const PAGE_SIZE = 20;

  const $ = (id) => document.getElementById(id);

  function authHeaders(extra) {
    const headers = Object.assign({}, extra || {});
    if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
    return headers;
  }

  async function api(path, options) {
    const response = await fetch(ctrlBaseUrl + path, Object.assign({
      headers: authHeaders({'Content-Type': 'application/json'})
    }, options || {}));
    if (response.status === 401) {
      authToken = '';
      sessionStorage.removeItem('xczs_token');
      updateLoginStatus();
      clearRenderedHistory();
      throw new Error('登录已失效，请重新登录');
    }
    if (!response.ok) {
      // 后端错误信封统一为 {error, failure_code, failure_reason}，无 detail 键；
      // 依次回退 error → failure_reason → statusText，避免操作员看到英文状态码。
      let detail = response.statusText;
      try {
        const body = await response.json();
        detail = body.error || body.failure_reason || detail;
      } catch (_) { /* ignore */ }
      throw new Error(detail);
    }
    return response.json();
  }

  function fmtTime(unix) {
    if (!unix) return '—';
    const d = new Date(unix * 1000);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
           `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  function fmtDuration(sec) {
    if (sec === null || sec === undefined) return '—';
    if (sec >= 60) return `${(sec / 60).toFixed(1)}分`;
    return `${sec.toFixed(1)}`;
  }

  function statusClass(status) {
    return { success: 'status-success', failed: 'status-failed',
             canceled: 'status-canceled', running: 'status-running',
             accepted: 'status-running' }[status] || '';
  }

  function updateLoginStatus() {
    const el = $('loginStatus');
    const loggedIn = Boolean(authToken);
    const noAuth = !authRequired;
    if (loggedIn || noAuth) {
      el.textContent = loggedIn ? '已登录' : '鉴权未启用';
      el.classList.add('logged-in');
    } else {
      el.textContent = '未登录';
      el.classList.remove('logged-in');
    }
    $('loginUser').hidden = noAuth || loggedIn;
    $('loginPass').hidden = noAuth || loggedIn;
    $('loginBtn').hidden = noAuth || loggedIn;
    $('logoutBtn').hidden = !loggedIn;
  }

  async function login() {
    const username = ($('loginUser').value || '').trim();
    const password = $('loginPass').value || '';
    if (!username || !password) return;
    const body = await api('/auth/login', {
      method: 'POST', body: JSON.stringify({ username, password })
    });
    authToken = body.access_token;
    sessionStorage.setItem('xczs_token', authToken);
    $('loginPass').value = '';
    updateLoginStatus();
    refresh();
  }

  function logout() {
    authToken = '';
    sessionStorage.removeItem('xczs_token');
    updateLoginStatus();
    clearRenderedHistory();
  }

  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function clearRenderedHistory() {
    $('summaryCards').replaceChildren();
    $('rows').replaceChildren();
    $('pageInfo').textContent = '';
    $('prevBtn').disabled = true;
    $('nextBtn').disabled = true;
    $('detailBody').replaceChildren();
    $('detailOverlay').classList.remove('open');
  }

  // ── 摘要卡 ─────────────────────────────────────────────────
  function renderSummary(summary) {
    const s = summary || {};
    const avgNav = s.avg_duration_seconds && s.avg_duration_seconds.navigate;
    const avgOp = s.avg_duration_seconds && s.avg_duration_seconds.operate;
    const cards = [
      { k: '任务总数', v: s.total || 0, cls: '' },
      { k: '成功', v: (s.by_status && s.by_status.success) || 0, cls: 'green' },
      { k: '失败', v: (s.by_status && s.by_status.failed) || 0, cls: 'red' },
      { k: '平均耗时 导航', v: avgNav !== undefined ? `${avgNav.toFixed(1)}s` : '—', cls: 'cyan' },
      { k: '平均耗时 操作', v: avgOp !== undefined ? `${avgOp.toFixed(1)}s` : '—', cls: 'cyan' },
    ];
    const fragment = document.createDocumentFragment();
    cards.forEach((card) => {
      const root = element('div', undefined, 'card');
      root.append(element('div', card.k, 'k'));
      root.append(element('div', card.v, `v ${card.cls}`.trim()));
      fragment.append(root);
    });
    $('summaryCards').replaceChildren(fragment);
  }

  // ── 列表 ───────────────────────────────────────────────────
  function currentFilters() {
    const since = $('fSince').value ? new Date($('fSince').value).getTime() / 1000 : undefined;
    const until = $('fUntil').value ? new Date($('fUntil').value).getTime() / 1000 : undefined;
    const params = new URLSearchParams({ page: String(currentPage), page_size: String(PAGE_SIZE) });
    const set = (k, v) => { if (v) params.set(k, v); };
    set('type', $('fType').value);
    set('status', $('fStatus').value);
    set('cabinet', $('fCabinet').value.trim());
    set('control_id', $('fControl').value.trim());
    set('failure_code', $('fFailure').value.trim());
    if (since) params.set('since', since.toFixed(3));
    if (until) params.set('until', until.toFixed(3));
    return params.toString();
  }

  async function loadList() {
    const data = await api('/task/history?' + currentFilters());
    const tbody = $('rows');
    if (!data.items || !data.items.length) {
      const row = document.createElement('tr');
      const cell = element('td', '暂无任务记录', 'empty');
      cell.colSpan = 9;
      row.append(cell);
      tbody.replaceChildren(row);
    } else {
      const fragment = document.createDocumentFragment();
      data.items.forEach((it) => {
        const failure = it.failure_code_name
          ? `${it.failure_code_name}${it.failure_reason ? '：' + it.failure_reason : ''}`
          : '—';
        const row = document.createElement('tr');
        row.append(
          element('td', fmtTime(it.created_at)),
          element('td', it.type_name || it.type || '—'),
          element('td', it.status_name || it.status || '—', statusClass(it.status)),
          element('td', it.cabinet || '—'),
          element('td', it.control_id ? (it.control_name || it.control_id) : '—'),
          element('td', it.command_name || it.command || '—'),
          element('td', failure),
          element('td', fmtDuration(it.duration_seconds)),
        );
        const detailCell = document.createElement('td');
        const detailButton = element('button', '详情', 'btn-outline');
        detailButton.addEventListener('click', () => openDetail(it.task_id));
        detailCell.append(detailButton);
        row.append(detailCell);
        fragment.append(row);
      });
      tbody.replaceChildren(fragment);
    }
    $('pageInfo').textContent = `第 ${data.page} / ${data.total_pages || 1} 页 · 共 ${data.total} 条`;
    $('prevBtn').disabled = data.page <= 1;
    $('nextBtn').disabled = data.page >= (data.total_pages || 1);
  }

  // ── 详情 ───────────────────────────────────────────────────
  function renderDetail(detail) {
    const r = detail.record || {};
    const kv = [
      ['任务 ID', r.task_id], ['类型', r.type_name || r.type],
      ['状态', r.status_name || r.status], ['阶段', r.phase_name || r.phase],
      ['进度', r.progress !== undefined ? (r.progress * 100).toFixed(0) + '%' : '—'],
      ['柜体', r.cabinet || '—'], ['控件', r.control_id ? (r.control_name || r.control_id) : '—'],
      ['命令', r.command_name || r.command || '—'],
      ['创建', fmtTime(r.created_at)], ['完成', fmtTime(r.completed_at)],
      ['耗时', fmtDuration(r.duration_seconds)],
      ['失败码', r.failure_code_name || r.failure_code || '—'],
      ['失败原因', r.failure_reason || '—'],
    ];
    const body = document.createDocumentFragment();
    const keyValues = element('div', undefined, 'kv');
    kv.forEach(([key, value]) => {
      const row = document.createElement('div');
      row.append(
        element('span', key, 'k'),
        element('span', value || '—', 'v'),
      );
      keyValues.append(row);
    });
    body.append(keyValues);

    const appendPayload = (title, value) => {
      const heading = element('h3', title);
      heading.style.cssText = 'color:var(--text-dim);font-size:13px;margin:6px 0';
      const payload = element('pre', undefined, 'payload');
      payload.textContent = value ? JSON.stringify(value, null, 2) : '—';
      body.append(heading, payload);
    };
    appendPayload('请求', r.request);
    appendPayload('结果', r.result);

    const timeline = element('div', undefined, 'timeline');
    const events = Array.isArray(detail.progress_events) ? detail.progress_events : [];
    timeline.append(element('h3', `进度明细（${events.length}）`));
    if (!events.length) {
      timeline.append(element('div', '无进度事件', 'empty'));
    } else {
      events.forEach((event) => {
        const progress = Number(event.progress);
        const progressText = Number.isFinite(progress) ? `${(progress * 100).toFixed(0)}%` : '—';
        const row = element('div', undefined, 'tl-row');
        row.append(
          element('span', fmtTime(event.timestamp), 't'),
          element('span', event.phase || '—', 'phase'),
          element('span', progressText, 'bar'),
          element('span', event.message || '', 'msg'),
        );
        timeline.append(row);
      });
    }
    body.append(timeline);
    $('detailBody').replaceChildren(body);
  }

  async function openDetail(taskId) {
    try {
      const detail = await api('/task/history/' + encodeURIComponent(taskId));
      renderDetail(detail);
      $('detailOverlay').classList.add('open');
    } catch (error) {
      alert(error.message);
    }
  }

  // ── 装配 ───────────────────────────────────────────────────
  async function refresh() {
    try {
      await Promise.all([loadList(), api('/task/history/summary').then(renderSummary)]);
    } catch (error) {
      alert(error.message);
    }
  }

  $('loginBtn').addEventListener('click', login);
  $('logoutBtn').addEventListener('click', logout);
  $('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  $('refreshBtn').addEventListener('click', () => { currentPage = 1; refresh(); });
  $('prevBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage -= 1; loadList(); } });
  $('nextBtn').addEventListener('click', () => { currentPage += 1; loadList(); });
  $('detailClose').addEventListener('click', () => $('detailOverlay').classList.remove('open'));
  $('detailOverlay').addEventListener('click', (e) => {
    if (e.target === $('detailOverlay')) $('detailOverlay').classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('detailOverlay').classList.remove('open');
  });

  async function initialize() {
    try {
      const response = await fetch(ctrlBaseUrl + '/health');
      const health = response.ok ? await response.json() : null;
      authRequired = !health || health.auth_required !== false;
    } catch (_) {
      // 保持默认的 fail-closed 登录状态；查询按钮仍可在网络恢复后重试。
      authRequired = true;
    }
    updateLoginStatus();
    if (!authRequired || authToken) refresh();
  }

  initialize();
})();
</script>
</body>
</html>
