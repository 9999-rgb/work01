# 7-DOF redundant arms use the LMA plugin (ships with moveit_kinematics).
# TRAC-IK is a more robust drop-in (trac_ik + nlopt, built from source and
# sourced before launch) but MoveIt 2 Humble's /compute_ik still returns the
# start state as a solution for in-workspace targets, so the goal-tree IK
# sampling fails regardless of solver; that is a move_group service issue.
left_arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5

right_arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5
