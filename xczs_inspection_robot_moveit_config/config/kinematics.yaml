# 7-DOF redundant arms use TRAC-IK (trust-region solver; far more robust than
# LMA/KDL for large folds).  It is built from source (trac_ik + nlopt) and
# sourced before run_all.sh; the plugin is a drop-in kinematics solver.
left_arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5

right_arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5
