# The 7-DOF redundant arms use the LMA plugin shipped by moveit_kinematics.
# Keep this file limited to plugins declared by package.xml and available in a
# standard ROS 2 Humble installation.  The startup preflight verifies the
# configured plugin classes before Gazebo or MoveIt are started, so an optional
# solver can no longer leave the Web UI falsely reporting an operable robot.
left_arm:
  kinematics_solver: lma_kinematics_plugin/LMAKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5

right_arm:
  kinematics_solver: lma_kinematics_plugin/LMAKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5
