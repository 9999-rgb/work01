amcl:
  ros__parameters:
    use_sim_time: true
    # The planar mover publishes ground-truth odometry (verified against
    # /model_states to ~1 mm), so the OmniMotionModel needs almost no injected
    # noise.  The historical 0.05 alphas added ~0.2 m of accumulated drift as
    # the robot crossed the floor, which made AMCL's map->odom correction fight
    # the (already accurate) odom and mis-localise the robot by up to 0.22 m.
    # Trusting the odometry keeps the particle cloud tight and the map pose
    # honest, so final-approach navigation actually converges on the goal.
    alpha1: 0.01
    alpha2: 0.01
    alpha3: 0.01
    alpha4: 0.01
    alpha5: 0.01
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 90
    max_particles: 10000
    min_particles: 1000
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::OmniMotionModel
    save_pose_rate: 0.5
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 1.57079632679
    sigma_hit: 0.5
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    # The planar mover publishes ground-truth odometry (verified against
    # /model_states to ~1 mm) and the initial pose is always reset, so the
    # measurement model does not need to correct for any drift.
    # Weighting the lidar at 0.5 let the "fuzzy" cabinet front face (buttons and
    # knobs protrude at different depths) bias the particles against the clean
    # map rectangle, accumulating a ~0.1 m map->odom offset over a multi-leg
    # route and stalling final approach just outside the goal checker.  Dropping
    # z_hit and smoothing sigma_hit keeps a weak lidar tie for robustness while
    # trusting the odometry, holding the offset to millimetres.
    z_hit: 0.1
    z_max: 0.05
    z_rand: 0.85
    z_short: 0.0
    scan_topic: /xczs/lidar/scan

amcl_map_client:
  ros__parameters:
    use_sim_time: true

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /xczs/odom
    # Keep a stable path until the goal changes or the costmap invalidates it.
    # Recomputing the same straight axis leg every second causes needless DWB
    # plan resets and visible micro-corrections on the omnidirectional base.
    default_nav_to_pose_bt_xml: "$(find-pkg-share xczs_inspection_robot_nav2)/config/behavior_trees/stable_axis_navigation.xml"
    bt_loop_duration: 10
    default_server_timeout: 20
    # Lifecycle manager activates behavior_server immediately before this
    # node.  The Humble default waits only 1 s for recovery Action discovery,
    # which is too short for a busy full Gazebo/MoveIt startup and can make
    # Nav2 activation fail nondeterministically.
    wait_for_service_timeout: 5000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    # The planar mover publishes odometry on the namespaced /xczs/odom topic;
    # the root-level /odom is owned by the zenoh bridge and does not flow.
    # Pointing the controller at the real topic is what lets DWB observe
    # velocity/position progress instead of stalling the progress checker.
    odom_topic: /xczs/odom
    # DWB evaluates a Cartesian product of vx/vy/vtheta samples.  Keep the
    # control loop aligned with the 10 Hz local costmap so the full Gazebo
    # stack can maintain simulation time without dropping control cycles.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
      - general_goal_checker
    controller_plugins:
      - FollowPath
    progress_checker:
      # Axis-by-axis navigation ends each leg with an in-place turn.  Count
      # angular motion as progress so a healthy turn is not aborted merely
      # because its translation stays inside required_movement_radius.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      # The simulated planar mover settles its final few degrees slowly.
      # Count about half a degree of real rotation as progress so a deliberate
      # corner turn is not mistaken for a stalled translation.
      required_movement_angle: 0.01
      # Half the historical 20 s stall window so a genuinely stuck goal
      # escalates to recovery (and, after the retry budget, to failure)
      # promptly instead of idling for tens of sim-seconds per leg.
      movement_time_allowance: 10.0
    general_goal_checker:
      # Keep checking translation while the final heading settles.  With the
      # stateful latch enabled, SimpleGoalChecker permanently stopped checking
      # XY after entering the tolerance once; the holonomic chassis could then
      # drift back outside the operation envelope while turning and Nav2 still
      # reported success.
      stateful: false
      plugin: nav2_controller::SimpleGoalChecker
      # Layered acceptance: this goal checker must stay *tighter* than the task
      # layer's NAVIGATION_POSITION_TOLERANCE_M (0.22) so the gateway's re-check
      # is meaningful, and the docking takeover distance (0.22 m) is the loosest
      # layer.  In the long open inspection scenes the lidar sees only the two
      # side walls, so AMCL's map pose drifts ~0.09-0.11 m in the (unobservable)
      # longitudinal direction; the checker accepts that drift while the real
      # stopping accuracy stays ~0.09 m, preserving checker < task <= takeover
      # (see test_nav2_config_contract.py).
      xy_goal_tolerance: 0.20
      # The simulated planar mover converges very slowly over its final few
      # degrees.  Precise cabinet docking has its own 0.35 rad takeover gate
      # and 0.07 rad closed-loop target, so stop coarse Nav2 rotation at this
      # tighter bound instead of entering recovery spins near the station.
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.50
      min_vel_y: -0.50
      max_vel_x: 0.50
      max_vel_y: 0.50
      max_vel_theta: 0.60
      min_speed_xy: 0.0
      max_speed_xy: 0.50
      min_speed_theta: 0.0
      acc_lim_x: 1.00
      acc_lim_y: 1.00
      acc_lim_theta: 1.20
      decel_lim_x: -1.00
      decel_lim_y: -1.00
      decel_lim_theta: -1.20
      # Odd counts retain an exact zero sample and symmetric positive/negative
      # velocities for the omnidirectional base.  21 samples give a 0.05 m/s
      # velocity step, shrinking the velocity-quantisation dead zone to ~0.10 m
      # so the base settles reliably inside the goal checker instead of parking
      # a few centimetres past it and stalling until recovery.  The resulting
      # 21*21*15 = 6615 trajectories stay under the 20^3 = 8000 explosion that
      # was avoided earlier.
      vx_samples: 21
      vy_samples: 21
      vtheta_samples: 15
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.3
      # Rotation-activation band for the RotateToGoal critic.  The DWB
      # GoalDist/PathDist/Oscillation equilibrium settles the base ~0.11-0.13 m
      # short of a goal, so this band must be *wider* than that stopping point
      # or the final yaw turn never begins (the robot parks just outside the
      # band and stalls until recovery).  0.20 m keeps the turn inside the same
      # window the checker accepts, so AMCL's longitudinal drift in the open
      # scenes can no longer leave the robot stranded outside the rotation band.
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - Twirling
        - PathDist
        - GoalDist
      BaseObstacle.scale: 0.02
      # The chassis is omnidirectional: track the path without repeatedly
      # aligning its body heading while translating.  A modest twirling cost
      # suppresses incidental rotation; RotateToGoal still owns final yaw.
      Twirling.scale: 5.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      # The default slowing_factor (5.0) makes the phase-2 critic penalise any
      # trajectory that crosses into xy_goal_tolerance while still translating.
      # On this omnidirectional base that penalty makes DWB stop *just outside*
      # the tolerance band (the robot settles ~0.15 m short and never enters
      # phase 3), so the final yaw turn never starts.  Dropping it to 0 lets the
      # critic begin scoring rotation the moment the goal is within tolerance,
      # which is safe here because the base can translate and rotate
      # independently; the approach finishes and the yaw converges together.
      RotateToGoal.slowing_factor: 0.0
      # A negative lookahead_time makes the critic score the trajectory's
      # final pose (sim_time seconds ahead), so every in-place alignment turn
      # overshoots the goal yaw and the critic settles on zero rotation a few
      # degrees short of the goal.  A short positive lookahead scores the
      # projected pose just ahead of the robot, so the final alignment turn
      # actually converges instead of stalling the goal checker.
      RotateToGoal.lookahead_time: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      # Plan in the map frame so DWB's distance-to-goal (and therefore the
      # RotateToGoal critic's activation window) agrees with the SimpleGoalChecker.
      # AMCL's map->odom correction routinely reaches ~0.05-0.10 m in this
      # environment; with an odom-frame local costmap that offset splits the
      # controller's "arrived" from the checker's, deadlocking final alignment.
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[-0.42, -0.42], [-0.42, 0.42], [0.55, 0.42], [0.55, -0.42]]"
      footprint_padding: 0.03
      plugins:
        - obstacle_layer
        - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /xczs/lidar/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.10
          obstacle_max_range: 7.5
          obstacle_min_range: 0.10
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.60
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.42, -0.42], [-0.42, 0.42], [0.55, 0.42], [0.55, -0.42]]"
      footprint_padding: 0.03
      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /xczs/lidar/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.10
          obstacle_max_range: 7.5
          obstacle_min_range: 0.10
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.60
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: true
    planner_plugins:
      - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.25
      use_astar: true
      # The Set B switch dock is on the cabinet's rear (east) face, behind the
      # cabinet column.  From the spawn side the lidar only sees the cabinets'
      # west faces, so the east approach corridor stays unknown; with
      # allow_unknown=false NavfnPlanner treats every unknown cell as lethal and
      # cannot plan to the switch dock at all ("failed to generate a valid
      # path").  The corridor behind the column is genuinely free (2.4 m wide
      # to the map edge), and the lidar-scanned west-face inflation already
      # covers the cabinet body, so routing through unknown is safe here.
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
      - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - assisted_teleop
      - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.60
    min_rotational_vel: 0.20
    rotational_acc_lim: 1.20

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.50, 0.50, 0.60]
    min_velocity: [-0.50, -0.50, -0.60]
    max_accel: [1.00, 1.00, 1.20]
    max_decel: [-1.00, -1.00, -1.20]
    odom_topic: /xczs/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
